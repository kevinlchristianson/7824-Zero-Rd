const facts = [
  ['Array', `${D.panels.length} × ${D.panel.watts} W = ${kw} kW`],
  ['Strings', `${S.length} × ${I.perString} panels, ${Math.round(S[0].vocCold)} V at ${lowF}°F`],
  ['Inverters', `A: ${S.filter(s => s.inverter === 'A').map(s => s.id).join(' ')} · B: ${S.filter(s => s.inverter === 'B').map(s => s.id).join(' ')}`],
  ['Junction box', `${ftin(D.jbox.x)} from the west gable, ${ftin(D.jbox.w)} up the slope`],
];
$('#facts').innerHTML = facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');

// ---------------------------------------------------------------- roof plan
{
  const R = D.roof, P = D.panel, sc = 12, mx = 64, my = 60, right = 230, bottom = 140;
  const Wd = R.widthFt * sc, Hd = R.lengthFt * sc, VW = mx + Wd + right, VH = my + Hd + bottom;
  const X = x => mx + x * sc, Y = w => my + (R.lengthFt - w) * sc;
  const pts = a => a.map(([x, w]) => `${X(x).toFixed(1)},${Y(w).toFixed(1)}`).join(' ');
  let g = `<defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--sheet)"/><line x1="0" y1="0" x2="0" y2="8" stroke="var(--hatch)" stroke-width="2"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker>
  </defs>`;
  // Roof slope and the setback line.
  g += `<rect class="d-roof" x="${X(0)}" y="${Y(R.lengthFt)}" width="${Wd}" height="${Hd}"/>`;
  g += `<rect class="d-rule" x="${X(R.edgeFt)}" y="${Y(R.lengthFt - R.ridgeFt)}" width="${(R.widthFt - 2 * R.edgeFt) * sc}" height="${(R.lengthFt - R.ridgeFt - R.edgeFt) * sc}" stroke-dasharray="3 4" stroke-width="1"/>`;
  // The center block butts into the lower east corner and stands south of it.
  const cx = R.center.x;
  g += `<rect x="${X(cx)}" y="${Y(R.center.w)}" width="${(R.widthFt - cx) * sc}" height="${R.center.w * sc}" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1"/>`;
  g += `<rect x="${X(cx)}" y="${Y(0)}" width="${(R.widthFt - cx) * sc + 40}" height="56" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1"/>`;
  g += `<text class="d-muted" x="${X(cx)}" y="${Y(0) + 74}">Center block, two-story: it shades this corner, so the rows step in</text>`;
  // Labels and dimensions.
  g += `<text class="d-label" x="${X(R.widthFt / 2)}" y="${Y(R.lengthFt) - 24}" text-anchor="middle">Ridge</text>`;
  g += `<text class="d-label" x="${X(R.widthFt * 0.3)}" y="${Y(0) + 22}" text-anchor="middle">Eave</text>`;
  g += `<text class="d-label" transform="translate(${X(0) - 16} ${Y(R.lengthFt / 2)}) rotate(-90)" text-anchor="middle">West gable</text>`;
  g += `<text class="d-label" transform="translate(${X(R.widthFt) + 18} ${Y(R.lengthFt * 0.72)}) rotate(90)" text-anchor="middle">East gable</text>`;
  g += `<line class="d-line" x1="${X(0)}" y1="${Y(R.lengthFt) - 10}" x2="${X(R.widthFt)}" y2="${Y(R.lengthFt) - 10}" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>`;
  g += `<rect class="d-sheet" x="${X(R.widthFt * 0.78) - 34}" y="${Y(R.lengthFt) - 18}" width="68" height="16"/>`;
  g += `<text class="d-mono" x="${X(R.widthFt * 0.78)}" y="${Y(R.lengthFt) - 6}" text-anchor="middle">${ftin(R.widthFt)}</text>`;
  g += `<line class="d-line" x1="${X(0) - 34}" y1="${Y(0)}" x2="${X(0) - 34}" y2="${Y(R.lengthFt)}" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>`;
  g += `<text class="d-mono" transform="translate(${X(0) - 40} ${Y(R.lengthFt * 0.2)}) rotate(-90)" text-anchor="middle">${ftin(R.lengthFt)} eave to ridge</text>`;
  // Column numbers above the top row.
  const colX = [...new Set(D.panels.map(q => q.x))].sort((a, b) => a - b);
  colX.forEach((x, i) => { g += `<text class="d-muted" x="${X(x)}" y="${Y(R.lengthFt) + 12}" text-anchor="middle">${i + 1}</text>`; });
  // Panels, numbered in string order.
  for (const q of D.panels) {
    const x0 = X(q.x - P.w / 2) + 1, y0 = Y(q.w + P.l / 2) + 1;
    g += `<g class="s${q.string}"><rect x="${x0}" y="${y0}" width="${P.w * sc - 2}" height="${P.l * sc - 2}" fill="var(--c)" fill-opacity="0.16" stroke="var(--c)" stroke-width="1.2"/>`;
    g += `<text class="d-mono" x="${x0 + 5}" y="${y0 + 13}" style="fill: var(--c)">${q.pos}</text></g>`;
  }
  // Home runs: dashed, along the rows under the panels, then to the box.
  const runs = S.flatMap(s => [s.minus, s.plus].map(h => ({ ...h, k: S.indexOf(s) })));
  const J = D.jbox, bw = 60, bh = 22;
  runs.forEach((h, i) => {
    const dx = (i - (runs.length - 1) / 2) * (bw - 8) / (runs.length - 1) / sc;
    const [[x0, w0]] = h.pts, wl = w0 - 0.95 - i * 0.06, vx = J.x + dx, wj = w0 > J.w ? J.w + bh / 2 / sc : J.w - bh / 2 / sc;
    g += `<polyline class="s${h.k}" points="${pts([[x0, w0], [x0, wl], [vx, wl], [vx, wj]])}" fill="none" stroke="var(--c)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
  });
  // Strings through the panel centers, with jumpers and end marks.
  for (const [k, s] of S.entries()) g += `<polyline class="s${k}" points="${pts(s.path)}" fill="none" stroke="var(--c)" stroke-width="2.4" stroke-linejoin="round"/>`;
  for (const j of D.jumpers) {
    const k = S.findIndex(s => s.id === j.string);
    g += `<line class="s${k}" x1="${X(j.from[0])}" y1="${Y(j.from[1])}" x2="${X(j.to[0])}" y2="${Y(j.to[1])}" stroke="var(--c)" stroke-width="7" stroke-opacity="0.35" stroke-linecap="round"/>`;
  }
  for (const [k, s] of S.entries()) {
    const [a, b] = [s.path[0], s.path.at(-1)];
    g += `<g class="s${k}"><circle cx="${X(a[0])}" cy="${Y(a[1])}" r="9" class="d-sheet" stroke="var(--c)" stroke-width="2"/><text class="d-text" x="${X(a[0])}" y="${Y(a[1]) + 4.5}" text-anchor="middle" style="font-weight:600">−</text>`;
    g += `<circle cx="${X(b[0])}" cy="${Y(b[1])}" r="9" class="d-sheet" stroke="var(--pos)" stroke-width="2"/><text class="d-pos" x="${X(b[0])}" y="${Y(b[1]) + 4.5}" text-anchor="middle" style="font: 600 13px var(--body)">+</text>`;
    g += `<rect x="${X(a[0]) + 11}" y="${Y(a[1]) - 21}" width="30" height="16" rx="2" fill="var(--c)"/><text x="${X(a[0]) + 26}" y="${Y(a[1]) - 9}" text-anchor="middle" style="font: 600 11.5px var(--mono); fill: var(--sheet)">${s.id}</text></g>`;
  }
  // Ground: row lugs linked down the stepped east side, tied to the box.
  const G = D.ground;
  g += `<polyline class="d-gnd" points="${pts(G.chain)}" stroke-width="2" stroke-dasharray="1.5 3" stroke-linecap="round"/>`;
  const tie = [G.tie[0], [J.x + (bw / 2 + 14) / sc, G.tie[0][1]], [J.x + (bw / 2 + 14) / sc, J.w], [J.x + bw / 2 / sc, J.w]];
  g += `<polyline class="d-gnd" points="${pts(tie)}" stroke-width="2" stroke-dasharray="1.5 3" stroke-linecap="round"/>`;
  for (const l of G.lugs) g += `<rect x="${X(l.x) - 4}" y="${Y(l.w) - 4}" width="8" height="8" fill="var(--gnd)"/>`;
  g += `<text class="d-muted" x="${X(G.lugs[2].x) + 8}" y="${Y(G.lugs[2].w) - 8}" style="fill: var(--gnd)">bare Cu ground, ${n0(G.ft)} ft</text>`;
  // Junction box and the drop to the inverters.
  g += `<rect x="${X(J.x) - bw / 2}" y="${Y(J.w) - bh / 2}" width="${bw}" height="${bh}" class="d-sheet" stroke="var(--ink)" stroke-width="1.8"/>`;
  g += `<text class="d-mono" x="${X(J.x)}" y="${Y(J.w) + 4}" text-anchor="middle" style="font-weight:600">J-box</text>`;
  const ix = X(R.widthFt) + 44, iy = Y(J.w) - 128;
  const invBox = (y, id, list) => `<rect x="${ix}" y="${y}" width="172" height="52" class="d-sheet" stroke="var(--ink)" stroke-width="1.4"/>
    <text class="d-text" x="${ix + 10}" y="${y + 19}" style="font-weight:600">Inverter ${id} · ${esc(I.inverter.name)}</text>
    <text class="d-muted" x="${ix + 10}" y="${y + 37}">${list.join(', ')} · one per MPPT</text>`;
  const A = S.filter(s => s.inverter === 'A').map(s => s.id), Bs = S.filter(s => s.inverter === 'B').map(s => s.id);
  g += invBox(iy, 'A', A) + invBox(iy + 66, 'B', Bs);
  g += `<text class="d-label" x="${ix}" y="${iy - 26}">Shop SE corner</text><text class="d-muted" x="${ix}" y="${iy - 10}">inside, directly below the J-box</text>`;
  for (const [t, y] of [[0, iy + 26], [1, iy + 92]]) {
    g += `<polyline class="d-line" points="${X(J.x) + bw / 2},${Y(J.w) - 4 + t * 8} ${ix - 18},${Y(J.w) - 4 + t * 8} ${ix - 18},${y} ${ix},${y}" stroke-width="2.2" marker-end="url(#arr)"/>`;
  }
  g += `<text class="d-muted" x="${ix - 12}" y="${Y(J.w) + 26}">2 × ¾″ conduit, ${n0(D.conduits[0].ft)} ft each</text>`;
  // Scale bar.
  const sy = Y(0) + 96;
  g += `<line class="d-line" x1="${X(0)}" y1="${sy}" x2="${X(20)}" y2="${sy}" stroke-width="1.4"/>`;
  for (const f of [0, 10, 20]) g += `<line class="d-line" x1="${X(f)}" y1="${sy - 5}" x2="${X(f)}" y2="${sy + 5}" stroke-width="1.4"/><text class="d-muted" x="${X(f)}" y="${sy + 19}" text-anchor="middle">${f} ft</text>`;
  const svg = $('#plan');
  svg.setAttribute('viewBox', `0 0 ${Math.ceil(VW)} ${Math.ceil(VH)}`);
  svg.innerHTML = g;
  $('#plan-key').innerHTML = S.map((s, k) => `<span class="s${k}" style="color: var(--c)"><i></i><b>${s.id}</b>&nbsp;inverter ${s.inverter}, ${esc(s.input)}</span>`).join('')
    + `<span><i class="dash"></i>home run</span><span style="color: var(--gnd)"><i class="dash"></i>ground</span>`;
  $('#plan-cap').textContent = `Drawn to scale, looking north from the courtyard: west on the left, eave at the bottom. Numbers give each panel's place in its string, from − to +. Each string runs up and down the columns; the thick faded links are the ${D.jumpers.length} short jumpers where a string steps diagonally. Every string's − and + home runs follow the rails under the panels to the junction box near the eave at the east end, which sits right above the inverters.`;
}

// ---------------------------------------------------------------- one-line
{
  const VW = 1180, top = 34, bh = 50, gap = 12, VH = top + S.length * (bh + gap) + 96;
  const sx = 16, sw = 250, jx = 420, jw = 96, ix = 720, iw = 220, ax = 1010;
  const sy = i => top + i * (bh + gap);
  let g = `<defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker></defs>`;
  const jTop = top - 6, jBot = sy(S.length - 1) + bh + 6;
  // Strings.
  S.forEach((s, i) => {
    const y = sy(i);
    g += `<g class="s${i}"><rect x="${sx}" y="${y}" width="${sw}" height="${bh}" class="d-sheet" stroke="var(--c)" stroke-width="1.6"/><rect x="${sx}" y="${y}" width="6" height="${bh}" fill="var(--c)"/>`;
    g += `<text class="d-text" x="${sx + 16}" y="${y + 20}" style="font-weight:600">${s.id} · ${s.n} × ${D.panel.watts} W</text>`;
    g += `<text class="d-muted" x="${sx + 16}" y="${y + 38}">${Math.round(s.vocCold)} V at ${lowF}°F · ${s.amps.toFixed(1)} A · Tigo on each</text></g>`;
    // + and − home runs to the junction box terminals.
    for (const [t, pol] of [[0, '+'], [1, '−']]) {
      const ty = jTop + 16 + (i * 2 + t) * ((jBot - jTop - 56) / (S.length * 2 - 1)), vx = sx + sw + 60 + i * 8 + t * 4;
      g += `<polyline points="${sx + sw},${y + 16 + t * 18} ${vx},${y + 16 + t * 18} ${vx},${ty} ${jx},${ty}" fill="none" style="stroke: ${pol === '+' ? 'var(--pos)' : 'var(--ink)'}" stroke-width="1.3"/>`;
      g += `<text class="d-mono" x="${jx + 6}" y="${ty + 4}" style="font-size:10px">${s.id}${pol}</text>`;
    }
  });
  g += `<text class="d-muted" x="${sx}" y="${top - 14}">10 AWG PV wire, red + / black −, ${n0(Math.min(...S.flatMap(s => [s.minus.ft, s.plus.ft])))}–${n0(Math.max(...S.flatMap(s => [s.minus.ft, s.plus.ft])))} ft</text>`;
  // Junction box with terminals and a ground bar.
  g += `<rect x="${jx}" y="${jTop}" width="${jw}" height="${jBot - jTop}" class="d-sheet" stroke="var(--ink)" stroke-width="1.8"/>`;
  g += `<text class="d-label" x="${jx + jw / 2}" y="${jTop - 8}" text-anchor="middle">J-box on roof</text>`;
  g += `<rect x="${jx + 8}" y="${jBot - 22}" width="${jw - 16}" height="10" fill="var(--gnd)"/><text class="d-muted" x="${jx + jw / 2}" y="${jBot + 18}" text-anchor="middle" style="fill: var(--gnd)">ground bar</text>`;
  // Two conduits to the inverters.
  const invY = [top + 10, top + 10 + (VH - top - 96) / 2];
  ['A', 'B'].forEach((id, t) => {
    const y = invY[t], list = S.filter(s => s.inverter === id), c = D.conduits[t];
    const cy = y + 60;
    g += `<line class="d-line" x1="${jx + jw}" y1="${cy}" x2="${ix}" y2="${cy}" stroke-width="5" stroke-linecap="butt" marker-end="url(#arr3)"/>`;
    g += `<text class="d-text" x="${(jx + jw + ix) / 2}" y="${cy - 12}" text-anchor="middle">Conduit ${id}: ${c.strings.join(', ')}</text>`;
    g += `<text class="d-muted" x="${(jx + jw + ix) / 2}" y="${cy + 22}" text-anchor="middle">¾″ conduit, ${n0(c.ft)} ft</text><text class="d-muted" x="${(jx + jw + ix) / 2}" y="${cy + 38}" text-anchor="middle">6 × 10 AWG THWN-2 + ground</text>`;
    g += `<rect x="${ix}" y="${y}" width="${iw}" height="136" class="d-sheet" stroke="var(--ink)" stroke-width="1.6"/>`;
    g += `<text class="d-text" x="${ix + 12}" y="${y + 22}" style="font-weight:600">Inverter ${id} · ${esc(I.inverter.name)}</text>`;
    list.forEach((s, m) => {
      const k = S.indexOf(s);
      g += `<g class="s${k}"><rect x="${ix + 12}" y="${y + 34 + m * 22}" width="10" height="10" fill="var(--c)"/><text class="d-mono" x="${ix + 30}" y="${y + 43 + m * 22}">${esc(s.input)} ← ${s.id}</text></g>`;
    });
    g += `<text class="d-muted" x="${ix + 12}" y="${y + 108}">${(list.length * I.perString * D.panel.watts / 1000).toFixed(1)} kW DC in, 12 kW AC out</text><text class="d-muted" x="${ix + 12}" y="${y + 125}">rapid-shutdown transmitter built in</text>`;
    g += `<line class="d-line" x1="${ix + iw}" y1="${y + 60}" x2="${ax}" y2="${y + 60}" stroke-width="1.6" marker-end="url(#arr2)"/>`;
    g += `<text class="d-muted" x="${ix + iw + 10}" y="${y + 52}">240 V AC</text>`;
  });
  g += `<rect x="${ax}" y="${invY[0] + 34}" width="150" height="${invY[1] - invY[0] + 52}" class="d-sheet" stroke="var(--ink)" stroke-width="1.4"/>`;
  g += `<text class="d-text" x="${ax + 12}" y="${invY[0] + 58}" style="font-weight:600">Main panel</text><text class="d-muted" x="${ax + 12}" y="${invY[0] + 76}">and net meter</text><text class="d-muted" x="${ax + 12}" y="${invY[0] + 94}">(AC side not detailed)</text>`;
  // Ground path along the bottom.
  const gy = VH - 36;
  g += `<polyline class="d-gnd" points="${sx + 8},${gy} ${jx + jw / 2},${gy} ${jx + jw / 2},${jBot - 12}" stroke-width="2"/>`;
  g += `<polyline class="d-gnd" points="${jx + jw / 2},${gy} ${ix + iw / 2},${gy} ${ix + iw / 2},${invY[1] + 136}" stroke-width="2"/>`;
  g += `<text class="d-muted" x="${sx + 8}" y="${gy - 8}" style="fill: var(--gnd)">7 row lugs → bare Cu, ${n0(D.ground.ft)} ft → J-box ground bar</text>`;
  g += `<text class="d-muted" x="${jx + jw / 2 + 10}" y="${gy + 18}" style="fill: var(--gnd)">green 10 AWG in each conduit → inverter grounds → grounding electrode</text>`;
  const svg = $('#oneline');
  svg.setAttribute('viewBox', `0 0 ${VW} ${Math.ceil(VH)}`);
  svg.innerHTML = g;
}

// ---------------------------------------------------------------- tables
$('#schedule').innerHTML = `<thead><tr><th>String</th><th>To</th><th>Columns</th><th>Voc at ${lowF}°F</th><th>Current</th><th>Home runs − / +</th></tr></thead><tbody>`
  + S.map((s, k) => `<tr><td class="s${k}"><span class="chip" style="background: var(--c)"></span><b>${s.id}</b></td><td>Inverter ${s.inverter}, ${esc(s.input)}</td><td class="num">${s.cols.map(c => c + 1).join(', ')}</td><td class="num">${Math.round(s.vocCold)} V</td><td class="num">${s.amps.toFixed(1)} A of ${s.iscMax} A</td><td class="num">${n0(s.minus.ft)} / ${n0(s.plus.ft)} ft</td></tr>`).join('')
  + `</tbody>`;
const spool = ft => (ft <= 250 ? 250 : ft <= 500 ? 500 : 1000);
const bom = [
  ['PV wire, 10 AWG red', `${n0(B.pvRedFt)} ft`, `+ home runs; a ${spool(B.pvRedFt)} ft spool`],
  ['PV wire, 10 AWG black', `${n0(B.pvBlackFt + B.jumperFt)} ft`, `− home runs and ${D.jumpers.length} jumpers; a ${spool(B.pvBlackFt + B.jumperFt)} ft spool`],
  ['THWN-2, 10 AWG red / black', `${n0(B.thwnRedFt)} ft each`, `in the two conduits, 6 per conduit`],
  ['THWN-2, 10 AWG green', `${n0(B.greenFt)} ft`, 'one ground per conduit'],
  ['Bare copper ground', `${n0(B.bareFt)} ft`, '#10 minimum under the array, #6 where exposed'],
  ['¾″ conduit and roof flashing', `2 × ${n0(D.conduits[0].ft)} ft`, 'one flashing per conduit'],
  ['Tigo TS4-A-F', `${B.rsd}`, 'one under each panel'],
  ['MC4 connectors', `${B.mc4Pairs} pairs`, 'plus spares; same make as the Tigo leads'],
  ['Junction box terminals', `${B.terminals}`, 'DC-rated for 10 AWG, plus a ground bar'],
  ['Row grounding lugs', `${D.ground.lugs.length}`, 'one per row (in your IronRidge list)'],
];
$('#bom').innerHTML = `<thead><tr><th>Item</th><th>Amount</th><th>Note</th></tr></thead><tbody>` + bom.map(([a, b, c]) => `<tr><td>${a}</td><td class="num">${b}</td><td>${c}</td></tr>`).join('') + `</tbody>`;

const notes = [
  `<b>Voltage.</b> ${I.perString} × ${I.panel.voc} V open-circuit, raised for Casper's ${lowF}°F design low with an assumed ${minus((I.panel.vocPerC * 100).toFixed(2))}%/°C coefficient, is ${Math.round(S[0].vocCold)} V, under the ${I.inverter.name}'s ${I.inverter.maxV} V limit. Check the coefficient on the ZnShine spec sheet.`,
  `<b>Current.</b> ${I.panel.isc} A × 1.25 = ${S[0].amps.toFixed(1)} A per string. MPPT 2 and 3 take up to 19 A and MPPT 1 takes 31 A, so each string gets an input of its own and none are paralleled.`,
  `<b>Lengths</b> include ${I.slackFt} ft of slack at each end. Home runs follow the rails under the panels, so the real runs can differ by a few feet.`,
  `<b>Junction box.</b> It sits on bare roof near the eave at the east end, directly above the inverters, so it needs a flashed roof-mount box rather than the rail-mounted JayBox.`,
  `<b>Two conduits.</b> Twelve current-carrying wires in one conduit would derate 10 AWG below what these strings need in a hot attic.`,
  `<b>Rapid shutdown.</b> A roof array needs a device under every panel. The 18kPV's built-in transmitter runs the Tigo units, and their leads link the panels, so only the two diagonal steps need jumpers.`,
  `<b>Connectors</b> must be the same make as the Tigo leads they plug into.`,
  `This is a planning drawing from the model, not a stamped plan. Have the electrical inspector review it before you buy.`,
];
$('#notes').innerHTML = notes.map(t => `<li>${t}</li>`).join('');
});
</script>

<script type="module">
zeroRd.page('offgrid', async tabRoot => {

const $ = s => tabRoot.querySelector(s);
const nf = (v, d = 0) => Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const usd = v => (v < 0 ? '−$' : '$') + nf(Math.abs(v));
const k$ = v => '$' + nf(v / 1000) + 'k';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const tip = $('#tip');
const showTip = (e, html) => { tip.innerHTML = html; tip.hidden = false; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };
const hideTip = () => { tip.hidden = true; };
const kit = (el, items) => $(el).replaceChildren(...items.map(([l, v, s]) => { const d = document.createElement('div'); d.innerHTML = '<div class="k-label"></div><div class="k-value"></div><div class="k-sub"></div>'; d.children[0].textContent = l; d.children[1].textContent = v; d.children[2].textContent = s; return d; }));

let D;
try { D = await (await fetch(new URL('./data/offgrid.json', import.meta.url))).json(); }
catch { $('#a-sub').textContent = 'The design data didn’t load. Reload the page to try again.'; throw new Error('no data'); }
const I = D.inputs, A = D.A, B = D.B.best;

// ---------------------------------------------------------------- A
const rec = A.best;
function partA() {
  const start = `${MON[A.start.month]} ${A.start.day}`;
  const N = D.Anormal?.best;
  $('#a-sub').textContent = `Grid down, in conservation mode: the shop unheated, downstairs held at its 60°F minimum with no warm-ups, upstairs at 65°F, and household lights and plug loads cut 60%. The grid-tied plan's ${I.outageKw} kW array moves onto two hybrid EG4 18kPVs so it keeps running with the grid down, with the Navien and Modine heating. Every week-long outage in the year was tried, starting with full batteries; the hardest began ${start}. The house needs only about ${nf(rec.peak, 1)} kW at its busiest hour, so ${rec.genH ? 'the generator barely runs' : 'two batteries carry the power alone and the generator never starts'}.${N ? ` Conservation cuts the electricity roughly in half (without it: ${nf(N.peak, 1)} kW peak, generator ${nf(N.genH)} h), but barely touches the gas: ${nf(rec.heatTh)} therms for heat against ${nf(N.heatTh)} living normally. Letting the shop go cold saves the most; a little of that comes back as extra loss through the wall it shares with downstairs. Anything in the shop that can freeze needs draining or its own small heat.` : ''}`;
  kit('#a-kit', [
    ['Batteries', `${nf(rec.battKwh)} kWh`, `${rec.nb} × EG4 16.1 kWh · ${usd(rec.nb * I.batt)}`],
    ['Generator', rec.genH ? `${rec.gen} kW` : 'Optional', rec.genH ? `runs ${nf(rec.genH)} h in the worst week, ${nf(rec.genKwh)} kWh` : `0 h in the worst typical week; a small portable is cheap insurance for a worse one`],
    ['Gas for the week', `${nf(rec.th)} therms`, rec.fuel ? `${nf(rec.heatTh)} for heat and hot water, ${nf(rec.fuel)} for the generator` : 'all of it for heat and hot water'],
    ['Propane, if gas is out too', `${nf(rec.gal)} gal`, `a ${rec.tank.gal}-gal tank (${nf(rec.tank.gal * 0.8)} gal usable)`],
  ]);
  const t = $('#a-rows');
  t.innerHTML = '<thead><tr><th>Batteries</th><th class="num">Generator</th><th class="num">Runs</th><th class="num">Generator fuel</th><th class="num">Heat + hot water</th><th class="num">Propane</th><th class="num">Kit cost</th></tr></thead>';
  const tb = t.createTBody();
  for (const r of [...A.rows].sort((a, b) => a.nb - b.nb)) {
    const tr = tb.insertRow(); if (r === rec || (r.nb === rec.nb && r.gen === rec.gen)) tr.className = 'pick';
    tr.insertCell().textContent = r.nb ? `${r.nb} × 16.1 = ${nf(r.battKwh)} kWh` : 'None';
    for (const v of [`${r.gen} kW`, `${nf(r.genH)} h`, `${nf(r.fuel)} thm`, `${nf(r.heatTh)} thm`, `${nf(r.gal)} gal → ${r.tank.gal}`, usd(r.cost)]) { const c = tr.insertCell(); c.className = 'num'; c.textContent = v; }
  }
}

function weekChart() {
  const el = $('#a-week'), W = Math.max(300, el.clientWidth), H = 250, m = { l: 40, r: 44, t: 10, b: 24 };
  const tr = A.trace, n = tr.length, hi = Math.max(4, Math.ceil(Math.max(...tr.map(h => Math.max(h.pv, h.load, h.gen))) / 2) * 2);
  const x = i => m.l + i / (n - 1) * (W - m.l - m.r), y = v => m.t + (hi - v) / hi * (H - m.t - m.b), ys = v => m.t + (1 - v) * (H - m.t - m.b);
  let g = '';
  const step = hi <= 8 ? 2 : hi <= 16 ? 4 : 5;
  for (let t = 0; t <= hi; t += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`;
  for (const v of [0, 0.5, 1]) g += `<text x="${W - m.r + 6}" y="${ys(v) + 3.5}">${v * 100}%</text>`;
  for (let d = 0; d <= 7; d++) g += `<line x1="${x(Math.min(n - 1, d * 24))}" x2="${x(Math.min(n - 1, d * 24))}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/>` + (d < 7 ? `<text x="${x(d * 24 + 12)}" y="${H - 6}" text-anchor="middle">day ${d + 1}</text>` : '');
  const area = (k, col) => `<path d="M${x(0)},${y(0)} ${tr.map((h, i) => `L${x(i).toFixed(1)},${y(h[k]).toFixed(1)}`).join(' ')} L${x(n - 1)},${y(0)}Z" fill="${col}" fill-opacity="0.28" stroke="${col}" stroke-width="1.2"/>`;
  g += area('pv', 'var(--s2)') + area('gen', 'var(--s0)');
  g += `<polyline points="${tr.map((h, i) => `${x(i).toFixed(1)},${y(h.load).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--s1)" stroke-width="1.6"/>`;
  g += `<polyline points="${tr.map((h, i) => `${x(i).toFixed(1)},${ys(h.soc).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--s3)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  g += `<text x="${m.l}" y="${m.t - 0}" dy="-2">kW</text>`;
  g += `<rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  el.querySelector('.hit').addEventListener('pointermove', e => {
    const b = el.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - b.left - m.l) / (W - m.l - m.r) * (n - 1)))), h = tr[i];
    showTip(e, `<div>Day ${Math.floor(i / 24) + 1}, ${String(i % 24).padStart(2, '0')}:00 · ${nf(h.T)}°F</div><div><b>${nf(h.pv, 1)}</b> kW solar</div><div><b>${nf(h.load, 1)}</b> kW house</div><div><b>${nf(h.gen, 1)}</b> kW generator</div><div><b>${nf(h.soc * 100)}%</b> battery</div><div><b>${nf(h.gas, 2)}</b> therms of gas for heat</div>`);
  });
  el.querySelector('.hit').addEventListener('pointerleave', hideTip);
  $('#a-legend').innerHTML = `<span><i style="background:var(--s2)"></i>Solar</span><span><i class="line" style="background:var(--s1)"></i>House load</span><span><i style="background:var(--s0)"></i>Generator</span><span><i class="line" style="background:var(--s3)"></i>Battery charge (right axis)</span>`;
}

// ---------------------------------------------------------------- B
function partB() {
  $('#b-behind').textContent = I.maxBehindH;
  const heat = `${I.tons[B.tons].label.toLowerCase()}${B.resKw ? ` with ${B.resKw} kW of resistance backup` : ''}`;
  const BN = D.Bnormal?.best, BA = D.Ball?.best, cd = x => `${nf(x.consH / 24, 1)} days`;
  $('#b-sub').textContent = `No gas at all: space heat from ${heat} in the buffer, hot water from your electric tankless fed preheated water. You live normally; when the batteries drop below ${B.cons ? nf(B.cons.on * 100) + '%' : 'empty'}, the house goes into conservation mode until they recover, ${cd(B)} a year in the typical year. The panels and batteries are sized so the power never runs out. Resistance covers the coldest hours, when the Apollos slow down or stop below −13°F, and uses only ${nf(B.resKwh)} kWh a year. Conservation barely shrinks this design: the worst cold snaps are mostly house heat, which conserving hardly cuts.${BN ? ` Never conserving takes ${BN.kw} kW and ${nf(BN.battKwh)} kWh (${k$(BN.capex)} up front)` : ''}${BA ? `; conserving all year takes ${BA.kw} kW and ${nf(BA.battKwh)} kWh (${k$(BA.capex)}).` : '.'}`;
  kit('#b-kit', [
    ['Panels', `${B.kw} kW`, `on ${B.ni} × EG4 18kPV (${B.ni * I.invAC} kW AC)`],
    ['Batteries', `${nf(B.battKwh)} kWh`, `${B.nb} × EG4 16.1 kWh`],
    ['Heat', I.tons[B.tons].label, B.resKw ? `plus ${B.resKw} kW resistance in the buffer` : 'no resistance'],
    ['Up front', k$(B.capex), `25-yr ${k$(B.life)} · conserves ${cd(B)} a year · grid-tied plan ${k$(D.grid.capex)} up front`],
  ]);
  const t = $('#b-rows');
  t.innerHTML = '<thead><tr><th>Heat pumps</th><th class="num">Resistance</th><th class="num">Longest behind</th><th class="num">Panels</th><th class="num">Batteries</th><th class="num">Up front</th><th class="num">25-yr cost</th></tr></thead>';
  const tb = t.createTBody();
  // Per heat pump set: the no-resistance row and the cheapest working row.
  const pick = [];
  for (const t0 of Object.keys(I.tons)) {
    const mine = D.B.rows.filter(r => r.tons === t0);
    const none = mine.find(r => r.resKw === 0), best = mine.filter(r => r.design).sort((a, b) => a.design.life - b.design.life)[0];
    if (none) pick.push(none); if (best && best !== none) pick.push(best);
  }
  for (const r of pick.sort((a, b) => (I.tons[a.tons].tons - I.tons[b.tons].tons) || (a.resKw - b.resKw))) {
    const tr = tb.insertRow(), d = r.design;
    if (d && d.tons === B.tons && d.resKw === B.resKw) tr.className = 'pick'; else if (!d) tr.className = 'no';
    tr.insertCell().textContent = r.label;
    const cells = [r.resKw ? `${r.resKw} kW` : 'none', `${nf(r.longestBehind)} h`, d ? `${d.kw} kW` : '—', d ? `${nf(d.battKwh)} kWh` : '—', d ? k$(d.capex) : 'falls behind', d ? k$(d.life) : ''];
    for (const v of cells) { const c = tr.insertCell(); c.className = 'num'; c.textContent = v; }
  }
}

// ---------------------------------------------------------------- C
const C = D.C.best;
const rule = p => p.socOn > 1 ? 'always' : `batteries < ${nf(p.socOn * 100)}%${p.tF != null ? ` or < ${p.tF}°F` : ''}`;
function partC() {
  $('#c-sub').textContent = `No gas: ${I.tons[C.tons].label.toLowerCase()} and an outdoor wood boiler (${nf(I.owbBtuh / 1000)}k Btu/h) both heat the buffer, and you live normally, shop and warm-ups included. The boiler burns when ${rule(C.policy)}, and whenever the heat pump can't carry the hour, so the batteries only have to run the house. The house conserves ${C.cons ? `when the batteries drop below ${nf(C.cons.on * 100)}%` : 'never'}: ${nf(C.consH / 24, 1)} days a year. Wood makes ${nf(C.woodShare * 100)}% of the year's heat from about ${nf(C.cords, 1)} cords, with the fire lit ${nf(C.burnH)} hours a year.`;
  kit('#c-kit', [
    ['Panels', `${C.kw} kW`, `on ${C.ni} × EG4 18kPV (${C.ni * I.invAC} kW AC)`],
    ['Batteries', `${nf(C.battKwh)} kWh`, `${C.nb} × EG4 16.1 kWh`],
    ['Heat', I.tons[C.tons].label, `plus the wood boiler · ${nf(C.cords, 1)} cords/yr (${usd(C.annual)})`],
    ['Up front', k$(C.capex), `25-yr ${k$(C.life)} · B: ${k$(B.capex)} up front, ${k$(B.life)} over 25 yr`],
  ]);
  const t = $('#c-rows');
  t.innerHTML = '<thead><tr><th>Heat pumps</th><th>Burn when</th><th class="num">Panels</th><th class="num">Batteries</th><th class="num">Wood</th><th class="num">Up front</th><th class="num">25-yr cost</th></tr></thead>';
  const tb = t.createTBody();
  for (const r of D.C.rows.filter(x => x.design).sort((a, b) => a.design.life - b.design.life).slice(0, 8)) {
    const d = r.design, tr = tb.insertRow();
    if (d.tons === C.tons && d.policy.socOn === C.policy.socOn && d.policy.tF === C.policy.tF) tr.className = 'pick';
    tr.insertCell().textContent = r.label; tr.insertCell().textContent = rule(r.policy);
    for (const v of [`${d.kw} kW`, `${nf(d.battKwh)} kWh`, `${nf(d.cords, 1)} cords`, k$(d.capex), k$(d.life)]) { const c = tr.insertCell(); c.className = 'num'; c.textContent = v; }
  }
}

function heatChart() {
  const el = $('#c-heat'), W = Math.max(300, el.clientWidth), H = 220, m = { l: 40, r: 8, t: 12, b: 24 };
  const wood = C.mon.wood.map(v => v / 1e6), hp = C.mon.hp.map(v => v / 1e6), tot = wood.map((v, k) => v + hp[k]);
  const step = [2, 5, 10, 20, 50].find(q => Math.max(...tot) / q <= 5) ?? 50, hi = Math.ceil(Math.max(...tot) / step) * step;
  const band = (W - m.l - m.r) / 12, bw = Math.min(26, band * 0.6), y = v => m.t + (hi - v) / hi * (H - m.t - m.b);
  let g = '';
  for (let t = 0; t <= hi + 1e-9; t += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`;
  for (let k = 0; k < 12; k++) {
    const cx = m.l + band * k + band / 2, x0 = cx - bw / 2;
    if (wood[k] > 0.01) g += `<rect x="${x0}" y="${y(wood[k])}" width="${bw}" height="${y(0) - y(wood[k])}" fill="var(--s2)"/>`;
    if (hp[k] > 0.01) g += `<rect x="${x0}" y="${y(tot[k])}" width="${bw}" height="${Math.max(0, y(wood[k]) - y(tot[k]) - 1)}" fill="var(--s1)"/>`;
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${MON[k][0]}</text><rect class="hit" data-k="${k}" x="${m.l + band * k}" y="${m.t}" width="${band}" height="${H - m.t - m.b}" fill="transparent"/>`;
  }
  g += `<text x="${m.l}" y="${m.t}" dy="-3">MMBtu</text>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  el.querySelectorAll('.hit').forEach(h => { const k = +h.dataset.k; h.addEventListener('pointermove', e => showTip(e, `<div>${MON[k]}</div><div><b>${nf(wood[k], 1)}</b> MMBtu wood (${nf(wood[k] / I.owbEff / I.cordMMBtu, 1)} cords)</div><div><b>${nf(hp[k], 1)}</b> MMBtu heat pump</div>`)); h.addEventListener('pointerleave', hideTip); });
  $('#c-legend').innerHTML = `<span><i style="background:var(--s2)"></i>Wood boiler</span><span><i style="background:var(--s1)"></i>Heat pump</span>`;
}

function socChart() {
  const el = $('#b-soc'), W = Math.max(300, el.clientWidth), H = 200, m = { l: 40, r: 10, t: 10, b: 24 };
  const s = B.daySoc, x = d => m.l + d / 364 * (W - m.l - m.r), y = v => m.t + (1 - v) * (H - m.t - m.b);
  let g = '';
  for (const t of [0, 0.25, 0.5, 0.75, 1]) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${t * 100}%</text>`;
  const starts = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  starts.forEach((d, k) => { g += `<text x="${x(d + 15)}" y="${H - 6}" text-anchor="middle">${MON[k][0]}</text>`; });
  g += `<polyline points="${s.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--s1)" stroke-width="1.4"/>`;
  g += `<polyline points="${C.daySoc.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--s2)" stroke-width="1.4"/>`;
  g += `<rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  el.querySelector('.hit').addEventListener('pointermove', e => {
    const b = el.getBoundingClientRect(), d = Math.max(0, Math.min(364, Math.round((e.clientX - b.left - m.l) / (W - m.l - m.r) * 364)));
    const mo = starts.findLastIndex(q => q <= d);
    showTip(e, `<div>${MON[mo]} ${d - starts[mo] + 1} · lowest charge</div><div><b>${nf(s[d] * 100)}%</b> B, ${nf(B.battKwh)} kWh</div><div><b>${nf(C.daySoc[d] * 100)}%</b> C, ${nf(C.battKwh)} kWh</div>`);
  });
  el.querySelector('.hit').addEventListener('pointerleave', hideTip);
  const sp = B.mon.spill.reduce((a, c) => a + c, 0), pr = B.mon.prod.reduce((a, c) => a + c, 0);
  $('#b-legend').innerHTML = `<span><i class="line" style="background:var(--s1)"></i>B · ${nf(B.battKwh)} kWh, ${nf(sp / pr * 100)}% of its solar wasted</span><span><i class="line" style="background:var(--s2)"></i>C · ${nf(C.battKwh)} kWh, the wood boiler takes over as they run low</span>`;
}

function notes() {
  const items = [
    ['Weather', 'The Casper TMY3 typical year, hour by hour. It holds a typical January, not a record one. For the outage, add margin to the gas; for full off grid, a week of storms, snow on the panels, or a colder January would need more battery than shown.'],
    ['Outage (A)', `The array is the grid-tied plan's ${I.outageKw} kW, on two hybrid inverters instead of grid-tie ones, which shut down with the grid. Every 7-day window in the year was tried, starting with full batteries. The generator starts when the batteries fall to 20% and runs flat out until they're back to 90%; with no batteries it follows the load, which burns more fuel per kWh. Generator fuel follows the Generac 22 kW curve (2.08 therms/h at half load, 3.07 at full), scaled by size. Propane holds ${I.propaneTh} therms per gallon and tanks fill to 80%. If natural gas stays on through the outage, which is typical, you need no tank at all. The busiest hour is only a few kW, so any 10 kW generator covers it; well pumps and shop tools can start higher for a moment.`],
    ['Off grid (B)', `No gas: the Apollos heat through the buffer at the outdoor-reset temperature, and resistance in the buffer covers the rest. Heat not delivered in an hour is delivered later, and the house may run behind up to ${I.maxBehindH} hours at a stretch (warm-ups after setbacks). Hot water comes from your electric tankless, fed cold water the buffer has preheated. The inverter count also covers the biggest electric hour. Panels, racking and site work are at the solar plan's $590/kW plus $4,000; the buffer and controls come from the hydronic pack.`],
    ['Conservation', `Conservation mode: shop unheated, downstairs held at its 60°F minimum, upstairs at 65°F, lights and plugs cut 60%, cooling set to 78°F. A uses it for the whole outage week. B and C live normally and switch to it only when the batteries fall below a threshold, until they recover, capped at ${nf(I.maxConsH / 24)} days a year; the optimizer picks the threshold. Switching is hour by hour, so the energy to reheat the shop afterward is only roughly counted.`],
    ['Wood (C)', `An outdoor wood boiler (assumed ${usd(I.owb)} installed with buried lines and an exchanger into the buffer, ${nf(I.owbBtuh / 1000)}k Btu/h, ${nf(I.owbEff * 100)}% efficient at full burn) heats the buffer. Whenever the fire is lit it runs flat out and banks what the house doesn't need, taking the 250-gal buffer up to ${I.bufferMaxF}°F (the upstairs floor keeps its mixing valve), and the house draws on that store before the heat pump runs. The hot tank also preheats the hot water nearly all the way, so the tankless barely runs while the fire's going. Efficiency is ${nf(I.owbEff * 100)}% at full burn, and the fire burns about ${nf(I.owbIdleBtuh / 1000)}k Btu/h of wood while it idles below full output. It burns when the batteries fall below the rule's threshold (until they recover) or it's colder than the rule's temperature, and always when the heat pump can't carry the hour. Wood is ${I.cordMMBtu} MMBtu a cord (Wyoming mixed woods) at ${usd(I.cordCost)} delivered; your own cutting and the daily loading in winter aren't priced.`],
    ['Prices', `Refurbished EG4 18kPV ${usd(I.inv)} and EG4 16.1 kWh battery ${usd(I.batt)} (your prices). Apollos at MBTEK less 20% plus install. Generators ${I.gens.map(g => `${g.kw} kW ${k$(g.cost)}`).join(', ')} installed, and propane tanks ${I.tanks.map(t => `${t.gal} gal ${k$(t.cost)}`).join(', ')}: all assumed. Resistance boiler ${usd(I.resBase)} + ${usd(I.resPerKw)}/kW (assumed). Off grid adds one battery replacement in year ${I.battLife} at ${nf(I.battReplaceShare * 100)}% of today's price.`],
  ];
  $('#notes').replaceChildren(...items.map(([k, v]) => { const li = document.createElement('li'); const b = document.createElement('b'); b.textContent = k + '. '; li.append(b, document.createTextNode(v)); return li; }));
}

async function tanks() {
  let T;
  try { T = await (await fetch(new URL('./data/tanks.json', import.meta.url))).json(); } catch { $('#t-sub').textContent = 'The tank comparison didn’t load.'; return; }
  const [base] = T.tanks, d = (v, b) => (Math.abs(v - b) < 50 ? '—' : (v > b ? '+' : '−') + '$' + nf(Math.abs(v - b)));
  $('#t-sub').textContent = `Each tank run through all three designs, with C's panels, batteries and burn rule re-optimized for it. Differences are against the BF250. The outage kit for A is ${A.best.nb} batteries and a ${A.best.gen} kW generator whichever tank you use: the Navien heats through the outage, so the tank never enters it. What changes for A is the grid-tied plan it protects.`;
  const t = $('#t-rows');
  t.innerHTML = '<thead><tr><th>Tank</th><th class="num">Tank cost</th><th class="num">Grid-tied, 25-yr</th><th class="num">B up front</th><th class="num">C up front</th><th class="num">C 25-yr</th><th class="num">C wood</th></tr></thead>';
  const tb = t.createTBody();
  for (const r of T.tanks) {
    const tr = tb.insertRow(); if (r === base) tr.className = 'pick';
    const c0 = tr.insertCell(); c0.textContent = r.label;
    const cells = r === base
      ? [usd(r.cost), usd(r.grid.life), usd(r.B.capex), usd(r.C.capex), usd(r.C.life), `${nf(r.C.cords, 1)} cords`]
      : [usd(r.cost), d(r.grid.life, base.grid.life), d(r.B.capex, base.B.capex), d(r.C.capex, base.C.capex), d(r.C.life, base.C.life), `${nf(r.C.cords, 1)} cords`];
    for (const v of cells) { const c = tr.insertCell(); c.className = 'num'; c.textContent = v; }
  }
  const f = $('#t-fixed');
  f.innerHTML = '<thead><tr><th>Buffer</th><th class="num">Hot-water coil</th><th class="num">Days conserving</th><th class="num">Power short</th><th class="num">House kWh/yr</th></tr></thead>';
  const fb = f.createTBody();
  for (const r of T.fixedC) {
    const tr = fb.insertRow(); if (r.gal === 250 && r.coil) tr.className = 'pick'; else if (r.unserved > 1 || r.consH > I.maxConsH) tr.className = 'no';
    tr.insertCell().textContent = `${r.gal} gal`;

<script type="module">
zeroRd.page('finance', async tabRoot => {

const clone = o => JSON.parse(JSON.stringify(o));

}

}
const phaseName = id => SIM.inputs.phases.find(p => p.id === id)?.name ?? id;
const shortPhase = id => phaseName(id).split(':')[0];
const acctName = key => key === 'truck' ? 'truck' : key.startsWith('ph:') ? `${shortPhase(key.slice(3))} line` : Object.fromEntries(DEBTS)[key];
const acctColor = key => key === 'heloc' ? COLOR.heloc : key === 'mortgage' ? COLOR.rental : key.startsWith('ph:') ? COLOR.phase : COLOR.other;

// ---------------------------------------------------------------- KPIs

// ---------------------------------------------------------------- this month
function monthCard(r, isNow) {

  d.append(h);
  const t = el('table', 'ledger'), add = (label, amt, cls, color) => { const tr = t.insertRow(); if (cls) tr.className = cls; const c = tr.insertCell(); if (color) { const i = el('i', 'sw'); i.style.background = color; c.append(i); } c.append(document.createTextNode(label)); if (amt != null) { const a = tr.insertCell(); a.className = 'amt'; a.textContent = amt; } else c.colSpan = 2; };

// ---------------------------------------------------------------- steps
function stepsList() {

// ---------------------------------------------------------------- debt over time

}

      g += `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${H - m.t - m.b}" fill="transparent"/>`;
    });
    node.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
    node.querySelectorAll('.hit').forEach(h => { const o = Y[+h.dataset.i]; h.addEventListener('pointermove', e => showTip(e, String(o.yr), [...(all ? parts.map((p, n) => ({ label: `${p.name} principal`, value: usd(o.by[n]), color: p.col, v: o.by[n] })).filter(r => r.v > 0.5).reverse() : [{ label: 'Principal', value: usd(o.principal), color: col }]), { label: 'Interest', value: usd(o.interest), color: COLOR.int }, { label: 'Balance at year end', value: usd(o.end) }])); h.addEventListener('pointerleave', hideTip); });
  }
  legend($('#amort-legend'), all ? [...parts.map(p => ({ label: p.name, color: p.col })), { label: 'Interest', color: COLOR.int }] : [{ label: 'Principal', color: col }, { label: 'Interest', color: COLOR.int }]);
  table($('#amort-table'), ['Year', 'Start', 'Drawn', 'Interest', 'Principal', 'End'], Y.map(o => ({ cells: [String(o.yr), usd(o.start), o.draw ? usd(o.draw) : '—', usd(o.interest), usd(o.principal), usd(o.end)] })), { num: j => j > 0 });
  table($('#amort-months'), ['Month', 'Start', 'Drawn', 'Interest', 'Principal', 'End'], A.slice(0, 24).map((x, i) => ({ cells: [L(rows[i].cal), usd(x.bal0, 2), x.draw ? usd(x.draw) : '—', usd(x.interest, 2), usd(x.principal, 2), usd(x.bal, 2)] })), { num: j => j > 0 });
}

// ---------------------------------------------------------------- history
function renderHistory() {
  const node = $('#history');
  if (!SIM) return;
  if (!checkins.length) {
    node.replaceChildren();
    $('#hist-sub').textContent = db ? 'No check-ins yet. Enter the balances from your statements, set the month they are as of, and press Save check-in. The first one becomes the plan the later ones are measured against.' : 'Check-ins are kept in the page’s own database, which is available when this page is open in Claude.';
    return;
  }
  const plan = planPoints();
  const rows = [...checkins].reverse().map(c => {
    const A = c.inputs.accounts, cal = calOf(c.asOf), debt = actualDebt(c.inputs), pl = atPlan(plan?.pts, cal);
    // Net position: brokerage less every debt, against the first plan's.
    const vs = pl && c !== plan.base ? (A.brokerage - debt) - (pl.brok - pl.debt) : null;
    const vsCell = el('span', vs == null || Math.abs(vs) < 50 ? '' : vs > 0 ? 'pos' : 'neg', vs == null ? (c === plan.base ? 'the plan' : '—') : Math.abs(vs) < 50 ? 'on plan' : `${vs > 0 ? 'ahead ' : 'behind '}${usd(Math.abs(vs))}`);
    const acts = el('div', 'btns');
    const load = el('button', 'btn small', 'Load'); load.type = 'button'; load.title = 'Put these balances and settings back in the inputs';
    load.addEventListener('click', () => { inputs = merge(clone(FIN_INPUTS), c.inputs); edited = true; buildForm(); run(); scheduleSave(); });
    const del = el('button', 'btn small danger', 'Delete'); del.type = 'button';
    del.addEventListener('click', () => { if (del.dataset.armed) { deleteCheckin(c.asOf); } else { del.dataset.armed = '1'; del.textContent = 'Confirm'; setTimeout(() => { delete del.dataset.armed; del.textContent = 'Delete'; }, 4000); } });
    acts.append(load, del);
    const note = el('span', null, dateLabel(c.asOf)); if (c.note) note.append(el('span', 'cellnote', c.note));
    return { cells: [note, usd(A.brokerage), usd(A.heloc), usd(sum(c.inputs.phases.map(p => p.status === 'open' ? p.bal : 0))), usd(A.mortgage), usd(A.truck + A.wf + A.usb), usd(debt), vsCell, L(c.summary?.debtFree), acts], cls: dayOf(c.asOf) === inputs.asOf ? 'pick' : '' };
  });
  table(node, ['As of', 'Brokerage', 'HELOC', 'Phase lines', 'Mortgage', 'Truck + cards', 'All debt', 'vs first plan', 'Debt-free then', ''], rows, { num: j => j > 0 && j < 9 });
  $('#hist-sub').textContent = `${checkins.length} saved. "vs first plan" is your net position (brokerage less every debt) against what the plan from ${dateLabel(plan.base.asOf)} expected for that month. "Debt-free then" is when that check-in's projection finished. Load puts a check-in's balances and settings back in the inputs.`;
}

// ---------------------------------------------------------------- other paths
function renderPaths() {

    V.map((v, j) => ({ cls: j === 0 ? 'pick' : '', cells: [v.label, L(v.s.helocClosed), L(v.s.debtFree), usd(v.s.interestPaid), usd(v.s.minBrok.v), k$(v.s.nwNet), j === 0 ? '' : Math.abs(v.s.nwNet - base.nwNet) < 1000 ? 'about the same' : `${v.s.nwNet >= base.nwNet ? '+' : '−'}${k$(Math.abs(v.s.nwNet - base.nwNet)).replace(/^−/, '')}`] })), { num: j => j > 0 });
}

  const items = [

  $('#notes').replaceChildren(...items.map(([k, v]) => { const li = el('li'); li.append(el('b', null, k + '. '), document.createTextNode(v)); return li; }));

const pctIn = v => Math.round(v * 1e5) / 1e3, pctOut = v => v / 100;

    ['rental.commission', 'Commission', 'pct'], ['rental.basis', 'Tax basis', 'usd'], ['rental.capGains', 'Capital gains rate', 'pct'], ['rental.recapture', 'Depreciation recapture', 'usd'], ['escalation', 'Energy savings growth', 'pct'],

function field(path, label, type, opts) {
  const f = el('div', 'field'), id = 'f-' + path.replace(/\./g, '-'), l = el('label', null, label); l.htmlFor = id;
  let c;
  const v = getIn(inputs, path);
  if (type === 'select') { c = el('select'); for (const [val, t] of opts) { const o = el('option', null, t); o.value = val; c.append(o); } c.value = v; }
  else if (type === 'bool') { c = el('input'); c.type = 'checkbox'; c.checked = !!v; }
  else if (type === 'month') { c = el('input'); c.type = 'month'; c.value = v; }
  else if (type === 'text') { c = el('input'); c.type = 'text'; c.value = v ?? ''; c.style.textAlign = 'left'; c.style.fontFamily = 'var(--body)'; }
  else { c = el('input'); c.type = 'number'; c.inputMode = 'decimal'; c.step = type === 'pct' ? '0.001' : type === 'int' ? '1' : '0.01'; c.value = type === 'pct' ? pctIn(v) : v; if (type === 'pct') l.textContent = label + ' (%)'; }
  c.id = id;
  const on = () => {
    let val;
    if (type === 'bool') val = c.checked;
    else if (type === 'select' || type === 'month' || type === 'text') { val = c.value; if (type === 'month' && !/^\d{4}-\d{2}$/.test(val)) return; }
    else { val = Number(c.value); if (c.value === '' || !Number.isFinite(val)) return; if (type === 'pct') val = pctOut(val); if (type === 'int') val = Math.max(1, Math.min(40, Math.round(val))); }
    if (getIn(inputs, path) === val) return;
    setIn(inputs, path, val); edited = true; scheduleSave(); rerun();
    if (path === 'strategy.mode' || path === 'strategy.sell' || /^phases\.\d+\.via$/.test(path)) buildForm();
  };
  c.addEventListener('change', on);
  if (c.tagName === 'INPUT' && c.type !== 'checkbox') c.addEventListener('input', on);
  f.append(l, c);
  return f;
}
function buildForm() {
  $('#asof').value = inputs.asOf; $('#note').value = inputs.note ?? '';
  const form = $('#form'), fresh = !form.children.length;
  const wasOpen = new Set([...form.querySelectorAll(':scope > details')].filter(d => d.open).map(d => d.querySelector('summary')?.textContent));
  form.replaceChildren();
  for (const g of GROUPS()) {
    const d = el('details'); if (fresh ? g.open : wasOpen.has(g.name)) d.open = true;
    d.append(el('summary', null, g.name));
    if (g.note) d.append(el('p', 'groupnote', g.note));
    if (g.fields) for (const [p, l, t, o] of g.fields) d.append(field(p, l, t, o));
    if (g.phases) inputs.phases.forEach((ph, i) => {
      const h = el('div', 'subhead'); const sw = el('i'); sw.style.cssText = `width:8px;height:8px;border-radius:2px;display:inline-block;background:${loanColor('ph:' + ph.id)}`; h.append(sw, document.createTextNode(`${i + 1}. ${ph.name.split(':')[0]}`)); d.append(h);
      d.append(field(`phases.${i}.amount`, 'Cost', 'usd'), field(`phases.${i}.saves`, 'Saves per year', 'usd'),
        field(`phases.${i}.via`, 'Pay with', 'select', [['line', 'A new HELOC after this one'], ['own', 'Its own HELOC, alongside this one'], ['heloc', 'Draw on this HELOC']]),
        // The trigger and start month only apply to phases that don't wait for this HELOC to close.
        ...(ph.via === 'heloc' || ph.via === 'own' ? [field(`phases.${i}.at`, 'Draw once the HELOC is down to', 'usd'), field(`phases.${i}.from`, 'Not before', 'month')] : []),
        field(`phases.${i}.status`, 'Status', 'select', [['pending', 'Not yet'], ['open', 'Bought: line open'], ['done', 'Done']]), field(`phases.${i}.bal`, 'Its own line owes', 'usd'));
    });
    if (g.gifts) inputs.gifts.forEach((gf, i) => {
      d.append(el('div', 'subhead', `Gift ${i + 1}`), field(`gifts.${i}.month`, 'Arrives', 'month'), field(`gifts.${i}.amount`, 'Amount', 'usd'), field(`gifts.${i}.keep`, 'Keep in brokerage', 'usd'));
    });
    form.append(d);
  }
}
$('#asof').addEventListener('change', e => { if (!/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) return; inputs.asOf = e.target.value; edited = true; scheduleSave(); rerun(); });

buildForm();
run();
let rz = 0;
// Keep the whole inputs panel on screen before it sticks too, so its last field is always reachable.
const fitInputs = () => { const a = $('.inputs'); if (getComputedStyle(a).position !== 'sticky') { a.style.maxHeight = ''; return; } const top = Math.max(0, a.getBoundingClientRect().top); a.style.maxHeight = `${top > innerHeight - 240 ? innerHeight : innerHeight - top}px`; };
addEventListener('scroll', fitInputs, { passive: true }); addEventListener('resize', fitInputs); requestAnimationFrame(fitInputs);
new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (SIM) { renderFlow(); renderDebt(); renderBrok(); renderNw(); renderAmort(); } }); }).observe($('#results'));
});
