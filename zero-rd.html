      <p class="lede">A U-shaped brick building that opens west onto a courtyard. The center block is two stories. Each leg is one tall volume. The buildings are plain rectangles butted together; the center block and the shop are each 48′ × 68′ inside. A 10′-deep arched porch runs along the center's courtyard face, with an open deck on top along the upper level. The north leg adds a vestibule across its west end. Every roof is a two-slope gable, and the panels show what fits on the south-facing slopes.</p>

    </section>

      <div class="vol" id="volumes"></div>
    </section>

    <section>
      <h2>Wall heights to scale</h2>
      <svg class="section-svg" id="section" viewBox="0 0 300 170" role="img" aria-label="Wall heights of the three volumes drawn to scale"></svg>
    </section>

    <section>
      <h2>Totals</h2>
      <dl class="totals" id="totals"></dl>
    </section>

    <section>
      <h2>Sources &amp; assumptions</h2>
      <ul class="notes">
        <li>Plan is scaled from Google Earth. The ruler reads 82.33&nbsp;ft along the north leg's north roof edge, which is about 0.33&nbsp;ft per pixel. Overall proportions were checked against the listing's overhead drone shot.</li>
        <li>The center block and the shop are 48′ × 68′ inside (yours), with about 16″ of brick and foam around them. The buildings butt together; the overlap seen from above is the eaves. The north leg's extra length to the measured roof edge is a vestibule behind the four west arches.</li>
        <li>The center wall stack is 11′ ground level, then 2′ of floor structure, then 9′ upper level, for a 22′ plate.</li>
        <li>Upper-level openings are yours: sixteen 41″ × 67″ windows, a 36″ door at the stair and a 72″ door, drawn as a slider onto a small north balcony (placement assumed).</li>
        <li>The arched porch is 10′ deep and stands outside the 48′ × 68′ box, with the upper-level deck on top (yours). The ground level has no windows: a 36″ walkout onto the porch and 86″ walkthroughs into the shop and south leg. The shop has no windows and no doors on the windward side (yours).</li>
        <li>Leg wall heights, the 5:12 roof pitch, the 1′‑6″ overhang, exact door positions, and the vestibule and south-leg openings are estimates from the listing photos.</li>
        <li>All three roofs are gables (yours). The ridges are assumed to run the long way, north–south on the center and east–west on the legs, so only the legs have south slopes.</li>
        <li>The max fit puts a panel on every spot that pays on the south, east and west slopes, with your plan's clearances, and keeps your rows on the shop. It is priced with the Solar tab's model: its panel, inverter and install costs, your rates, the same heat pump setup, and one EG4 18kPV per 18&nbsp;kW of panels.</li>
        <li>Panels are your ZnShine 440&nbsp;W, 68″ × 45″, ½″ apart, kept 12″ clear of eaves and gable ends and 18″ off ridges. The shop has 72: your IronRidge layout (57 panels) carried east as far as the center block's shade allows. Shade from the other buildings is worked out hour by hour on the Casper weather year; trees are left out. <code>npm run roofpv</code> rebuilds the layout in <code>data/roofpv.json</code>.</li>
        <li>All inputs live in <code>model/params.js</code>, shared with the heating and cooling model. <code>npm run export</code> writes OBJ and GLB files to <code>export/</code>.</li>
      </ul>
    </section>

<div class="page">
  <header class="masthead">
    <div>
      <p class="eyebrow">Financial model · 7824 Zero Rd</p>
      <h1>Debt-Free &amp; Off Grid Capable</h1>
      <p class="lede">Every account as of your last check-in, run forward month by month: what to pay this month, the steps and triggers ahead, and each loan's amortization. Change any balance under Accounts &amp; plan and it all reruns. Save a check-in each month and the page keeps the history against the plan.</p>
    </div>
    <p class="status" id="status" role="status">Loading…</p>
  </header>

  <div class="flag" id="flag" role="alert" hidden></div>
  <div class="kpis" id="kpis" aria-label="Headline results"></div>

  <div class="layout">
    <main class="results" id="results">
      <section id="sec-now">
        <h2>What to do this month</h2>
        <p class="sub" id="now-sub"></p>
        <div class="months" id="months"></div>
      </section>

      <section id="sec-steps">
        <h2>Steps ahead</h2>
        <p class="sub" id="steps-sub"></p>
        <ol class="steps" id="steps"></ol>
      </section>

      <section id="sec-triggers">
        <h2>Cash-flow triggers</h2>
        <p class="sub">Rules the plan runs on. Each has its own trigger, what to do when it fires, when the plan expects it, and where it stands at this check-in.</p>
        <div class="table-wrap"><table class="data" id="triggers"></table></div>
      </section>

      <section id="sec-flow">
        <h2>Where each month's money goes</h2>
        <p class="sub" id="flow-sub"></p>
        <div class="legend" id="flow-legend"></div>
        <div class="chart" id="flow" role="img" aria-label="Monthly money in and money out for the next three years"></div>
        <details class="tv"><summary>Table view</summary><div class="table-wrap" id="flow-table"></div></details>
      </section>

      <section id="sec-debt">
        <h2>Debt over time</h2>
        <p class="sub" id="debt-sub"></p>
        <div class="legend" id="debt-legend"></div>
        <div class="chart" id="debt" role="img" aria-label="Every debt balance stacked over time, with the first plan and the check-ins"></div>
        <details class="tv"><summary>Table view</summary><div class="table-wrap" id="debt-table"></div></details>
        <h3>Brokerage against its floor</h3>
        <p class="sub" id="brok-sub"></p>
        <div class="legend" id="brok-legend"></div>
        <div class="chart" id="brok" role="img" aria-label="Brokerage balance against the floor, with the first plan and the check-ins"></div>
      </section>

      <section id="sec-nw">
        <h2>Net worth</h2>
        <p class="sub" id="nw-sub"></p>
        <div class="legend" id="nw-legend"></div>
        <div class="chart" id="nw" role="img" aria-label="Assets stacked above the line, debt below, and net worth as a line, over time"></div>
        <details class="tv"><summary>Table view</summary><div class="table-wrap" id="nw-table"></div></details>
      </section>

      <section id="sec-amort">
        <h2>Amortization</h2>
        <p class="sub">Each loan on its own: the balance month by month, and what each year's payments go to. The HELOC and the phase lines are interest-only, so their principal is whatever surplus the plan sends them.</p>
        <div class="tabs" id="amort-tabs" role="group" aria-label="Loan"></div>
        <div class="facts" id="amort-facts"></div>
        <div class="pair">
          <div><h3>Balance</h3><div class="chart" id="amort-bal" role="img" aria-label="Loan balance over time"></div></div>
          <div><h3>Each year's payments</h3><div class="legend" id="amort-legend"></div><div class="chart" id="amort-yr" role="img" aria-label="Principal and interest paid each year"></div></div>
        </div>
        <div class="table-wrap"><table class="data" id="amort-table"></table></div>
        <details class="tv"><summary>Month by month, next 24 months</summary><div class="table-wrap" id="amort-months"></div></details>
      </section>

      <section id="sec-history">
        <h2>Check-ins</h2>
        <p class="sub" id="hist-sub"></p>
        <div class="table-wrap"><table class="data" id="history"></table></div>
      </section>

      <section id="sec-paths">
        <h2>Other paths from here</h2>
        <p class="sub">The same balances run under other rules. "Net of paycheck" is net worth at the end of the horizon, including the rental until it sells, minus everything the paycheck put in: the workbook's own yardstick. Zero Rd counts once you enter its value; the equipment doesn't.</p>

<script type="module">
// Each page's script registers here and runs the first time its tab opens,
// inside the tab's own shadow root.
const KEY = 'zero-rd-tab';
const tablist = document.querySelector('.zr-tabs');
const tabs = [...tablist.querySelectorAll('[role="tab"]')];
const panels = new Map([...document.querySelectorAll('.zr-panel')].map(p => [p.dataset.page, p]));

const defs = {};
const def = id => defs[id] || (defs[id] = (() => { let resolve; const promise = new Promise(r => { resolve = r; }); return { promise, resolve }; })());
window.zeroRd = { page: (id, run) => def(id).resolve(run) };

const opened = new Set();
async function open(id) {
  if (opened.has(id)) return;
  opened.add(id);
  const root = panels.get(id).attachShadow({ mode: 'open' });
  root.append(document.getElementById('zr-tpl-' + id).content.cloneNode(true));
  try { await (await def(id).promise)(root); }
  catch (err) {
    console.error(err);
    const p = document.createElement('p');
    p.setAttribute('role', 'alert');
    p.style.cssText = 'margin: 24px 20px; font: 14px/1.5 var(--body); color: var(--ink);';
    p.textContent = `This tab didn’t finish loading (${err?.message || err}). Reload the page to try again.`;
    root.prepend(p);
  }
}

// Pages take the viewer's theme from their own tab.
const syncTheme = () => {
  const t = document.documentElement.getAttribute('data-theme');
  for (const p of panels.values()) { if (t) p.setAttribute('data-theme', t); else p.removeAttribute('data-theme'); }
};
new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
syncTheme();

let current = null;
const scrolls = {};
function select(id, focus = false) {
  if (!panels.has(id) || id === current) return;
  if (current) scrolls[current] = scrollY;
  current = id;
  for (const t of tabs) {
    const on = t.dataset.page === id;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
    if (!on) continue;
    if (focus) t.focus({ preventScroll: true });
    const l = t.offsetLeft, r = l + t.offsetWidth;
    if (l < tablist.scrollLeft || r > tablist.scrollLeft + tablist.clientWidth) tablist.scrollLeft = l - 16;
  }
  for (const [k, p] of panels) p.hidden = k !== id;
  try { localStorage.setItem(KEY, id); } catch { /* storage unavailable */ }
  open(id);
  scrollTo(0, scrolls[id] || 0);
  dispatchEvent(new Event('resize'));
}

tablist.addEventListener('click', e => { const t = e.target.closest('[role="tab"]'); if (t) select(t.dataset.page); });
tablist.addEventListener('keydown', e => {
  const i = tabs.indexOf(document.activeElement);
  const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
  if (i < 0 || to == null) return;
  e.preventDefault();
  select(tabs[(to + tabs.length) % tabs.length].dataset.page, true);
});
addEventListener('hashchange', () => select(location.hash.slice(1)));

let first = location.hash.slice(1);
if (!panels.has(first)) {
  first = tabs[0].dataset.page;
  try { const saved = localStorage.getItem(KEY); if (panels.has(saved)) first = saved; } catch { /* storage unavailable */ }
}
select(first);
</script>
<script type="module">
zeroRd.page('model', async tabRoot => {
const THREE = await import('three');
const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
const { buildHouse, pvPanels, pvMaxFit, summary, DEFAULTS, wallsOf, centerPlate, gableOf } = await import('./model/building.js');
const P = DEFAULTS;
const stage = tabRoot.getElementById('stage');
const css = n => getComputedStyle(tabRoot.host).getPropertyValue(n).trim();
const ftin = v => {
  const f = Math.floor(v + 1e-6), i = Math.round((v - f) * 12);
  return i === 12 ? `${f + 1}′` : i ? `${f}′‑${i}″` : `${f}′`;
};

// ---------------- sheet
const rows = summary(P);
tabRoot.getElementById('volumes').innerHTML = rows.map(r => `
  <div class="vol-row">
    <span class="vol-name">${r.name}</span>
    <span class="vol-dim">${ftin(r.ew)} × ${ftin(r.ns)}</span>
    <span class="vol-sub">${r.heights.map(([k, v]) => `${k} ${ftin(v)}`).join(' · ')}</span>
    ${(r.parts || []).map(([k, a, b]) => `<span class="vol-sub">${k} ${ftin(a)} × ${ftin(b)}</span>`).join('')}
    <span class="vol-sub">roof ${ftin(r.roofEW)} × ${ftin(r.roofNS)} E–W × N–S</span>
  </div>`).join('');

{
  // Footprint union: legs overlap the center at its NW and SW corners.
  const cw = wallsOf(P.center.roof, P.overhang);
  const area = w => (w.x1 - w.x0) * (w.z1 - w.z0);
  const overlap = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) *
                            Math.max(0, Math.min(a.z1, b.z1) - Math.max(a.z0, b.z0));
  const nw = wallsOf(P.north.roof, P.overhang), sw = wallsOf(P.south.roof, P.overhang);
  const foot = area(cw) + area(nw) + area(sw) - overlap(cw, nw) - overlap(cw, sw);
  const gross = foot + area(cw);
  const fmt = n => Math.round(n).toLocaleString('en-US');
  const all = [cw, nw, sw];
  const ext = { x: Math.max(...all.map(w => w.x1)) - Math.min(...all.map(w => w.x0)),
                z: Math.max(...all.map(w => w.z1)) - Math.min(...all.map(w => w.z0)) };
  tabRoot.getElementById('totals').innerHTML = `
    <dt>Footprint</dt><dd>${fmt(foot)} sq ft</dd>
    <dt>Gross, with upper level</dt><dd>${fmt(gross)} sq ft</dd>
    <dt>Overall E–W × N–S</dt><dd>${ftin(ext.x)} × ${ftin(ext.z)}</dd>
    <dt>Center plate / ridge</dt><dd>${ftin(centerPlate(P))} / ${ftin(gableOf(P, 'center').ridgeY)}</dd>`;
}

{
  // Heights to scale: 1 ft = 5 px, grade at y = 150.
  const s = 5, g = 150, c = P.center;
  const bars = [
    { x: 20, w: 70, name: 'CENTER', parts: [[c.ground, 'var(--brick)'], [c.floor, 'var(--band)'], [c.upper, 'var(--brick)']] },
    { x: 125, w: 60, name: 'NORTH LEG', parts: [[P.north.wall, 'var(--brick)']] },
    { x: 215, w: 60, name: 'SOUTH LEG', parts: [[P.south.wall, 'var(--brick)']] },
  ];
  let out = `<line x1="8" x2="292" y1="${g}" y2="${g}" stroke="var(--ink)" stroke-width="1.2"/>`;
  for (const b of bars) {
    let y = g;
    for (const [h, fill] of b.parts) {
      out += `<rect x="${b.x}" y="${y - h * s}" width="${b.w}" height="${h * s}" fill="${fill}" stroke="var(--ink)" stroke-width="0.8"/>`;
      if (b.parts.length > 1) out += `<text x="${b.x + b.w + 5}" y="${y - h * s / 2 + 3.5}">${ftin(h)}</text>`;
      y -= h * s;
    }
    const top = g - b.parts.reduce((a, [h]) => a + h, 0) * s;
    out += `<path d="M${b.x - 4} ${top} L${b.x + b.w / 2} ${top - 16} L${b.x + b.w + 4} ${top} Z" fill="var(--roof)"/>`;
    out += `<text class="lbl" x="${b.x + b.w / 2}" y="${g + 14}" text-anchor="middle">${b.name}</text>`;
    if (b.parts.length === 1) out += `<text x="${b.x + b.w / 2}" y="${top + 14}" text-anchor="middle">${ftin(b.parts[0][0])}</text>`;
  }
  out += `<text x="${bars[0].x + bars[0].w / 2}" y="${g - centerPlate(P) * s + 14}" text-anchor="middle">${ftin(centerPlate(P))} plate</text>`;
  tabRoot.getElementById('section').innerHTML = out;
}

// ---------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.tabIndex = 0;
renderer.domElement.setAttribute('aria-label', '3D model viewport');
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const applyTheme = () => {
  const sky = new THREE.Color(css('--sky') || '#dfe6ea');
  scene.background = sky;
  scene.fog = new THREE.Fog(sky, 420, 900);
};
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const camera = new THREE.PerspectiveCamera(35, 1, 1, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 20;
controls.maxDistance = 900;

scene.add(new THREE.HemisphereLight(0xf2f5ff, 0x8a7a5c, 1.1));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.4);
sun.position.set(-120, 200, 140);   // summer afternoon, from the southwest
sun.target.position.set(-25, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -170, right: 170, top: 170, bottom: -170, near: 10, far: 600 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.3;
scene.add(sun, sun.target);

const house = buildHouse(P);
scene.add(house);
const layer = n => house.getObjectByName(n);

tabRoot.getElementById('tgl-roofs').addEventListener('change', e => { layer('roofs').visible = e.target.checked; });
tabRoot.getElementById('tgl-site').addEventListener('change', e => { layer('site').visible = e.target.checked; });

// ---------------- solar layout (data/roofpv.json)
const pvBox = tabRoot.getElementById('pv');
fetch(new URL('./data/roofpv.json', import.meta.url), { cache: 'no-cache' }).then(r => r.json()).then(L => {
  const pv = pvPanels(L);
  pv.visible = tabRoot.getElementById('tgl-pv').checked;
  house.add(pv);
  tabRoot.getElementById('tgl-pv').addEventListener('change', e => { pv.visible = e.target.checked; });
  const fit = pvMaxFit(L);
  fit.visible = tabRoot.getElementById('tgl-max').checked;
  house.add(fit);
  tabRoot.getElementById('tgl-max').addEventListener('change', e => { fit.visible = e.target.checked; });
  renderMaxFit(L);
  const n = v => Math.round(v).toLocaleString('en-US'), kw = v => v.toFixed(1);
  const shape = s => s.planned
    ? `rows of ${L.inputs.rows[s.key].join(', ')} from the eave up, ${s.orient}`
    : `${s.rows} rows × ${s.cols} ${s.orient}${s.panels.length > s.n ? ` · ${s.panels.length - s.n} spots too shaded` : ''}`;
  pvBox.innerHTML = L.slopes.map(s => !s.south ? '' : s.n ? `
    <div class="vol-row">
      <span class="vol-name">${s.name}</span>
      <span class="vol-dim">${s.n} panels · ${kw(s.kw)} kW</span>
      <span class="vol-sub">south slope ${ftin(s.widthFt)} × ${ftin(s.lengthFt)}; ${shape(s)}</span>
      <span class="vol-sub">${n(s.kwh)} kWh a year${s.room > s.n ? ` · room for ${s.room - s.n} more` : ''}</span>
    </div>` : `
    <div class="vol-row">
      <span class="vol-name">${s.name}</span>
      <span class="vol-dim">none yet</span>
      <span class="vol-sub">south slope ${ftin(s.widthFt)} × ${ftin(s.lengthFt)}: room for ${s.room} panels</span>
    </div>`).join('') + L.slopes.filter(s => !s.south).map(s => `
    <div class="vol-row">
      <span class="vol-name">${s.name}</span>
      <span class="vol-dim">—</span>
      <span class="vol-sub">ridge runs north–south: its slopes face east and west</span>
    </div>`).join('');
  tabRoot.getElementById('pv-key-shade').hidden = !L.slopes.some(s => s.south && s.panels.some(q => !q.kept));
  const T = L.totals;
  tabRoot.getElementById('pv-totals').innerHTML = `
    <dt>Panels</dt><dd>${T.panels}</dd>
    <dt>Size</dt><dd>${kw(T.kw)} kW DC</dd>
    <dt>Output a year</dt><dd>${n(T.kwh)} kWh</dd>
    <dt>Per kW, on a ${(L.pitch * 12).toFixed(0)}:12 roof</dt><dd>${n(T.kwh / T.kw)} kWh</dd>`;
}).catch(() => { pvBox.textContent = 'The panel layout didn’t load. Reload the page to try again.'; });

// The most that fits on every slope that doesn't face north, priced like the
// solar plan (npm run roofpv).
function renderMaxFit(L) {
  const F = L.maxFit;
  if (!F?.econ) { tabRoot.getElementById('fit-sec').hidden = true; tabRoot.querySelector('label[for="tgl-max"]').hidden = true; return; }
  const E = F.econ, mine = L.totals.panels, n = v => Math.round(v).toLocaleString('en-US'), usd = v => '$' + n(v);
  const yr = v => (v == null ? `not within ${E.horizon} years` : `${v.toFixed(1)} years`);
  const face = { S: 'south', E: 'east', W: 'west' }, order = { S: 0, E: 1, W: 2 };
  const south = Math.max(...F.slopes.filter(s => s.face === 'S').map(s => s.perKw));
  tabRoot.getElementById('fit').innerHTML = [...F.slopes].sort((a, b) => order[a.face] - order[b.face]).map(s => `
    <div class="vol-row">
      <span class="vol-name">${s.name}, ${face[s.face]}</span>
      <span class="vol-dim">${s.n} panels · ${s.kw.toFixed(1)} kW</span>
      <span class="vol-sub">${s.planned ? `your ${s.planned} + ${s.n - s.planned} more, ` : ''}${s.orient}${s.face === 'S' ? '' : `; ${n(s.perKw)} kWh per kW, ${Math.round(s.perKw / south * 100)}% of a south slope's`}</span>
    </div>`).join('');
  tabRoot.getElementById('fit-totals').innerHTML = `
    <dt>Panels</dt><dd>${F.totals.panels}</dd>
    <dt>Size</dt><dd>${F.totals.kw.toFixed(1)} kW DC</dd>
    <dt>Inverters</dt><dd>${E.inverters} × ${E.inverter}</dd>
    <dt>Output a year, after the inverters</dt><dd>${n(E.all.prod)} kWh</dd>
    <dt>Cost</dt><dd>${usd(E.all.capex)}</dd>
    <dt>Saves the first year</dt><dd>${usd(E.all.save1)}</dd>
    <dt>Pays back in</dt><dd>${yr(E.all.payback)}</dd>`;
  tabRoot.getElementById('fit-key-own').textContent = `Your ${mine}`;
  tabRoot.getElementById('fit-more').textContent = `Your ${mine} already make more than the building uses (${n(E.plan.prod)} kWh a year after the inverters, against ${n(E.use)}), so the ${F.totals.panels - mine} added panels only make surplus, paid at the $${E.avoided.toFixed(2)}/kWh avoided cost. They cost ${usd(E.more.capex)} and earn ${usd(E.more.save1)} a year: ${E.more.payback == null ? `they don't pay back within ${E.horizon} years` : `they pay back in ${yr(E.more.payback)}`}, and over ${E.horizon} years at ${Math.round(E.discount * 100)}% they're worth ${usd(Math.abs(E.more.npv))} ${E.more.npv < 0 ? 'less' : 'more'} than they cost. Your ${mine} alone pay back in ${yr(E.plan.payback)}.`;
  tabRoot.getElementById('fit-limits').textContent = `Not priced: ${E.acKw} kW AC of inverters is past the ${E.nemCapKwAC} kW AC that Rocky Mountain Power's Wyoming net metering takes, so it needs its own interconnection and maybe a service upgrade. Covering ${Math.round(F.coverage * 100)}% of the roof, fire code wants ${F.code.ridgeFt * 12}″ clear of each ridge instead of ${L.inputs.ridgeFt * 12}″, which leaves ${F.code.panels} panels (${F.code.kw.toFixed(1)} kW).`;
}

// ---------------- views
const VIEWS = {
  solar:     { pos: [-45, 165, 245], target: [-38, 8, -12] },
  courtyard: { pos: [-205, 62, 38], target: [-12, 9, 0] },
  southwest: { pos: [-190, 120, 205], target: [-25, 6, 0] },
  northeast: { pos: [135, 85, -175], target: [-25, 8, -5] },
  plan:      { pos: [-26, 380, 0.5], target: [-26, 0, 0] },
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tween = null;
function go(name, instant) {
  const v = VIEWS[name];
  tabRoot.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const to = { pos: new THREE.Vector3(...v.pos), target: new THREE.Vector3(...v.target) };
  if (instant || reduce) {
    camera.position.copy(to.pos); controls.target.copy(to.target); controls.update();
    tween = null; return;
  }
  tween = { t0: performance.now(), dur: 700, from: { pos: camera.position.clone(), target: controls.target.clone() }, to };
}
tabRoot.getElementById('views').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]');
  if (b) go(b.dataset.view);
});
controls.addEventListener('start', () => { tween = null; });
go('solar', true);

// ---------------- loop
const north = tabRoot.getElementById('north');
function resize() {
  const { width, height } = stage.getBoundingClientRect();
  renderer.setSize(width, height, false);
  camera.aspect = width / Math.max(height, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

renderer.setAnimationLoop(now => {
  if (tabRoot.host.hidden) return;
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2;
    camera.position.lerpVectors(tween.from.pos, tween.to.pos, e);
    controls.target.lerpVectors(tween.from.target, tween.to.target, e);
    if (k === 1) tween = null;
  }
  controls.update();
  north.style.transform = `rotate(${THREE.MathUtils.radToDeg(controls.getAzimuthalAngle())}deg)`;
  renderer.render(scene, camera);
});
});
</script>

<script type="module">
zeroRd.page('thermal', async tabRoot => {
const { SCHEMA, INPUTS, ZONES, ZONE_NAMES, GROUPS, getIn, setIn, sessionSummary } = await import('./model/thermal.js');
const { DEFAULTS, wallsOf, vestibuleDepth, openings } = await import('./model/params.js');
const $ = s => tabRoot.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => Array.from(a).reduce((s, v) => s + v, 0);
const nf = (v, d = 0) => Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const F = c => c * 1.8 + 32;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const HEATED = ['shop', 'ground', 'upper'];
const ZCOLOR = { shop: 'var(--z-shop)', ground: 'var(--z-ground)', upper: 'var(--z-upper)', outdoor: 'var(--outdoor)' };
const SHORT = { shop: 'Shop', ground: 'Ground level', upper: 'Upper level', garage: 'South leg' };
const STORE = 'zero-rd-thermal-inputs-v2';

// ---------------------------------------------------------------- inputs state
function merge(base, over) {
  for (const k of Object.keys(over || {})) {
    if (!(k in base)) continue;
    if (base[k] && typeof base[k] === 'object') merge(base[k], over[k]);
    else base[k] = over[k];
  }
  return base;
}
let inputs = clone(INPUTS);
try { const s = localStorage.getItem(STORE); if (s) inputs = merge(clone(INPUTS), JSON.parse(s)); } catch { /* storage unavailable */ }
const saveInputs = () => { try { localStorage.setItem(STORE, JSON.stringify(inputs)); } catch { /* ignore */ } };
const atDefaults = () => JSON.stringify(inputs) === JSON.stringify(INPUTS);

// ---------------------------------------------------------------- run orchestration
let R = null, SENS = null, sensFresh = false, reqId = 0, worker = null, inlineMod = null, wxCache = null;
const statusEl = $('#status'), resultsEl = $('#results');
function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }

function startWorker() {
  try {
    worker = new Worker(new URL('./model/thermal-worker.js', import.meta.url), { type: 'module' });
    worker.onmessage = ({ data }) => onResult(data);
    worker.onerror = e => { e.preventDefault?.(); worker = null; runInline(reqId); };
  } catch { worker = null; }
}
async function runInline(id) {
  try {
    inlineMod ||= await import('./model/thermal.js');
    wxCache ||= await (await fetch(new URL('./data/casper-tmy3.json', import.meta.url))).json();
    const r = inlineMod.runModel(wxCache, inputs);
    onResult({ id, result: inlineMod.slimResult(r) });
  } catch (err) { onResult({ id, error: String(err.message || err) }); }
}
let timer = 0;
function scheduleRun(delay = 350) {
  clearTimeout(timer);
  resultsEl.classList.add('stale');
  setStatus('Calculating…', 'busy');
  timer = setTimeout(() => {
    const id = ++reqId;
    if (worker) worker.postMessage({ id, inputs }); else runInline(id);
  }, delay);
}
function onResult({ id, result, sensitivity, error }) {
  if (id !== reqId) return;
  if (error) { setStatus(`Model error: ${error}`, 'error'); return; }
  if (sensitivity) { SENS = sensitivity; sensFresh = true; if (R) renderSensitivity(); return; }
  R = result; sensFresh = false;
  resultsEl.classList.remove('stale');
  setStatus('Up to date');
  renderAll();
}

// ---------------------------------------------------------------- helpers
const tip = $('#tip');
function showTip(evt, head, rows) {
  tip.replaceChildren();
  const h = document.createElement('div'); h.className = 't-head'; h.textContent = head; tip.append(h);
  for (const r of rows) {
    const row = document.createElement('div'); row.className = 't-row';
    const key = document.createElement('i'); key.style.background = r.color || 'transparent';
    const b = document.createElement('b'); b.textContent = r.value;
    const s = document.createElement('span'); s.textContent = r.label;
    row.append(key, b, s); tip.append(row);
  }
  tip.hidden = false;
  const pad = 14, w = tip.offsetWidth, hgt = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + hgt > innerHeight - 8) y = evt.clientY - hgt - pad;
  tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
}
const hideTip = () => { tip.hidden = true; };

function niceTicks(lo, hi, count = 5) {
  const span = hi - lo || 1, raw = span / count, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= count) || 10 * mag;
  const t0 = Math.floor(lo / step) * step, t1 = Math.ceil(hi / step) * step, out = [];
  for (let v = t0; v <= t1 + step / 2; v += step) out.push(Math.round(v / step) * step);
  return out;
}
// Bar path with a 4px rounded data end (top when up, bottom when down).
function barPath(x, y0, y1, w, up, r = 4) {
  const h = Math.abs(y1 - y0);
  if (h < 0.5) return '';
  r = Math.min(r, h, w / 2);

// Doorways the owner described: gaps in the walls with their width.
function doorMarks(P, C, L) {
  let out = '';
  for (const o of openings(P)) {
    let xa, xb, za, zb, lx, lz, lab;
    if (o.panel === 'center.N' && o.to) { const cx = C.x1 - o.x; xa = cx - o.w / 2; xb = cx + o.w / 2; za = zb = C.z0; lx = cx; lz = C.z0 + 6.5; }
    else if (o.panel === 'center.S' && o.to) { const cx = C.x0 + o.x; xa = cx - o.w / 2; xb = cx + o.w / 2; za = zb = C.z1; lx = cx; lz = C.z1 - 3; }
    else if (o.panel === 'center.W' && o.zone === 'ground') { const cz = C.z0 + P.wallT + o.x; xa = xb = C.x0; za = cz - o.w / 2; zb = cz + o.w / 2; lx = C.x0 + 2; lz = cz + 1.6; }
    else continue;
    lab = `${Math.round(o.w * 12)}″`;
    out += `<line x1="${xa}" y1="${za}" x2="${xb}" y2="${zb}" stroke="var(--sheet)" stroke-width="3"/>`;
    out += `<text x="${lx}" y="${lz}" text-anchor="${o.panel === 'center.W' ? 'start' : 'middle'}" class="ps">${lab}</text>`;
  }
  return out;
}

function renderMonthly() {
  const el = $('#month-chart'), W = Math.max(300, el.clientWidth), H = 280;
  const m = { l: 44, r: 6, t: 10, b: 24 };
  const CM = R.cost.monthly;
  const heat = HEATED.map(z => CM[z].map(x => x.gas + x.heatElec));
  const cool = CM.upper.map(x => x.coolElec);
  const up = Math.max(...MON.map((_, k) => heat[0][k] + heat[1][k] + heat[2][k]), 1);
  const down = Math.max(...cool, 1);
  const ticks = niceTicks(-down, up, 6);
  const lo = ticks[0], hi = ticks.at(-1);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);

      const v = series[k];

      if (yb - yt > 0.5) g += `<path d="${isTop ? barPath(x, yb, yt, bw, true) : `M${x},${yb}V${yt}H${x + bw}V${yb}Z`}" fill="${ZCOLOR[HEATED[s]]}"/>`;

    h.addEventListener('pointerleave', hideTip);
  });
  legend($('#month-legend'), [
    ...HEATED.map(z => ({ color: ZCOLOR[z], label: `${SHORT[z]} heating` })),
    { color: 'color-mix(in srgb, var(--z-upper) 45%, var(--sheet))', label: 'Upper level cooling' },

  const tb = tbl.createTBody();

    const tot = heat[0][k] + heat[1][k] + heat[2][k] + cool[k];
    row(mo, [...heat.map(sr => [sr[k], 0]), [cool[k], 0], [tot, 0], [therms, 0], [kwh, 0]]);
  });
  const c = R.cost.totals;

// ---------------------------------------------------------------- sensitivity
function renderSensitivity() {
  const el = $('#tornado');
  el.classList.toggle('stale', !sensFresh);
  if (!SENS) { el.replaceChildren(Object.assign(document.createElement('p'), { className: 'fine', textContent: 'Working out the ranges…' })); return; }
  const base = SENS.base;
  const rows = [...SENS.rows].sort((a, b) => Math.abs(b.worse.total - b.better.total) - Math.abs(a.worse.total - a.better.total));
  const vals = rows.flatMap(r => [r.better.total, r.worse.total]).concat(base);
  const lo0 = Math.min(...vals), hi0 = Math.max(...vals), pad = (hi0 - lo0) * 0.24 + 1;
  const lo = lo0 - pad, hi = hi0 + pad, pct = v => `${((v - lo) / (hi - lo) * 100).toFixed(2)}%`;
  el.replaceChildren(...rows.map(r => {
    const row = document.createElement('div'); row.className = 'trow';
    const lab = document.createElement('div'); lab.className = 'tlabel';
    const b = document.createElement('b'); b.textContent = r.label;
    const sp = document.createElement('span'); sp.textContent = `${r.better.label} to ${r.worse.label}`;
    lab.append(b, sp);
    const tr = document.createElement('div'); tr.className = 'ttrack';
    const cheap = Math.min(r.better.total, r.worse.total), dear = Math.max(r.better.total, r.worse.total);
    const seg = (cls, a, z) => { const d = document.createElement('div'); d.className = `tseg ${cls}`; d.style.left = pct(a); d.style.width = `calc(${pct(z)} - ${pct(a)})`; return d; };
    if (cheap < base - 0.5) tr.append(seg('better', cheap, base));
    if (dear > base + 0.5) tr.append(seg('worse', base, dear));
    const bl = document.createElement('div'); bl.className = 'tbase'; bl.style.left = pct(base); tr.append(bl);
    const vl = document.createElement('span'); vl.className = 'tval l'; vl.style.left = pct(Math.min(cheap, base)); vl.textContent = cheap < base - 0.5 ? `$${nf(cheap)}` : '';
    const vr = document.createElement('span'); vr.className = 'tval r'; vr.style.left = pct(Math.max(dear, base)); vr.textContent = dear > base + 0.5 ? `$${nf(dear)}` : '';
    tr.append(vl, vr);
    tr.setAttribute('aria-label', `${r.label}: $${nf(r.better.total)} at ${r.better.label}, $${nf(r.worse.total)} at ${r.worse.label}`);
    row.append(lab, tr);
    return row;
  }));
  legend($('#tornado-legend'), [
    { color: 'var(--bar)', label: `cheaper than the $${nf(base)} estimate` },
    { color: 'var(--accent)', label: 'costlier' },
  ]);
}

// ---------------------------------------------------------------- balance table
function renderBalance() {
  const M = R.main, idx = z => ZONES.indexOf(z);
  const rows = GROUPS.filter(([g]) => HEATED.some(z => Math.abs(M.flows[idx(z)][GROUPS.findIndex(x => x[0] === g)]) > 5e4));
  const gi = g => GROUPS.findIndex(x => x[0] === g);
  const lossTotal = z => GROUPS.reduce((s, [g]) => s + Math.max(0, M.flows[idx(z)][gi(g)]), 0);
  const t = $('#balance');
  t.innerHTML = `<thead><tr><th>Path</th>${HEATED.map(z => `<th class="num">${SHORT[z]}</th>`).join('')}</tr></thead>`;
  const tb = t.createTBody();
  const sep = label => { const tr = tb.insertRow(); tr.className = 'sep'; const c = tr.insertCell(); c.colSpan = 4; c.textContent = label; };
  sep('Heat lost');
  for (const [g, label] of rows) {
    const tr = tb.insertRow();
    tr.insertCell().textContent = g === 'air' ? 'Air leakage (wind + stack)' : g === 'zones' ? 'To neighbouring zones (net)' : label;
    for (const z of HEATED) {
      const v = M.flows[idx(z)][gi(g)], c = tr.insertCell(); c.className = 'num';
      const wrap = document.createElement('div'); wrap.className = 'cellbar';
      const track = document.createElement('div'); track.className = 'track';
      const fill = document.createElement('div'); fill.className = 'fill' + (g === 'air' ? ' hot' : '');
      fill.style.width = `${Math.max(0, v) / lossTotal(z) * 100}%`;
      track.append(fill);
      const num = document.createElement('span'); num.textContent = nf(v / 1e6, 1);
      wrap.append(track, num); c.append(wrap);
    }
  }
  sep('Covered by');
  const line = (label, f, cls) => {
    const tr = tb.insertRow(); if (cls) tr.className = cls; tr.insertCell().textContent = label;
    for (const z of HEATED) { const c = tr.insertCell(); c.className = 'num'; c.textContent = f(idx(z)); }
  };
  line('Sun through glass', k => nf(M.solar[k] / 1e6, 1));
  line('People, lights, equipment', k => nf(M.internal[k] / 1e6, 1));
  line('Heating delivered', k => nf(M.heatTot[k] / 1e6, 1), 'total');
  line('Cooling removed (subtract)', k => (M.coolTot[k] > 0 ? nf(M.coolTot[k] / 1e6, 1) : '—'));
  const air = HEATED.reduce((s, z) => s + Math.max(0, M.flows[idx(z)][gi('air')]), 0);
  const all = HEATED.reduce((s, z) => s + lossTotal(z), 0);
  $('#balance-sub').innerHTML = '';
  $('#balance-sub').append(
    'Net heat leaving each heated zone over the year, by path, and what covers it. MMBtu per year. ',
    Object.assign(document.createElement('strong'), { textContent: `Air leakage is ${nf(air / all * 100)}% of the total` }),
    ', the largest single path, and most of it is wind-driven.');
}

// ---------------------------------------------------------------- wind chart
function renderWind() {
  const el = $('#wind-chart'), W = Math.max(300, el.clientWidth), H = 260;
  const m = { l: 40, r: 96, t: 12, b: 30 };
  const data = R.windCurve.map(d => ({ ...d, total: d.shop + d.ground + d.upper }));
  const series = [...HEATED, 'total'];
  const maxV = Math.max(...data.map(d => d.total)) / 1000;
  const ticks = niceTicks(0, maxV, 5), hi = ticks.at(-1);
  const x = v => m.l + v / 40 * (W - m.l - m.r), y = v => m.t + (hi - v) / hi * (H - m.t - m.b);
  const color = s => (s === 'total' ? 'var(--ink)' : ZCOLOR[s]);
  let g = '';
  for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${nf(t)}</text>`;
  for (let v = 0; v <= 40; v += 10) g += `<text x="${x(v)}" y="${H - 12}" text-anchor="middle">${v}</text>`;
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H}" text-anchor="middle">wind speed at the airport, mph</text>`;
  // Design wind marker.
  const vd = Vdesign();
  g += `<line x1="${x(vd)}" x2="${x(vd)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--rule)"/>`;
  for (const s of series) {
    const pts = data.map(d => `${x(d.mph)},${y(d[s] / 1000)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${color(s)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const at = (s, v) => { const a = data.find(d => d.mph >= v) || data.at(-1), b = data[Math.max(0, data.indexOf(a) - 1)]; const f = a.mph === b.mph ? 0 : (v - b.mph) / (a.mph - b.mph); return (b[s] + f * (a[s] - b[s])) / 1000; };
  const dv = at('total', vd);
  g += `<circle cx="${x(vd)}" cy="${y(dv)}" r="4" fill="var(--ink)" stroke="var(--sheet)" stroke-width="2"/>`;
  g += `<text class="lbl" x="${x(vd) + 7}" y="${y(dv) - 8}">${nf(dv)} at the ${nf(vd, 1)} mph design wind</text>`;
  // Direct labels at the right end, spread with leader lines.
  const ends = series.map(s => ({ s, y: y(data.at(-1)[s] / 1000) })).sort((a, b) => a.y - b.y);
  let prev = -Infinity;
  for (const e of ends) { e.ly = Math.max(e.y, prev + 13); prev = e.ly; }
  for (const e of ends) {
    const x0 = x(40);
    g += `<line x1="${x0 + 2}" y1="${e.y}" x2="${x0 + 10}" y2="${e.ly}" stroke="var(--rule)"/>`;
    g += `<text class="lbl" x="${x0 + 13}" y="${e.ly + 4}">${e.s === 'total' ? 'All three' : SHORT[e.s]}</text>`;
  }
  g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" visibility="hidden"/>`;
  g += `<rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const xh = el.querySelector('.xh'), hit = el.querySelector('.hit');
  hit.addEventListener('pointermove', e => {
    const box = el.getBoundingClientRect(), v = (e.clientX - box.left - m.l) / (W - m.l - m.r) * 40;
    const d = data.reduce((a, b) => (Math.abs(b.mph - v) < Math.abs(a.mph - v) ? b : a));
    xh.setAttribute('x1', x(d.mph)); xh.setAttribute('x2', x(d.mph)); xh.setAttribute('visibility', 'visible');
    showTip(e, `${d.mph} mph · ${nf(Tdesign())}°F · kBtu/h`, [
      { color: 'var(--ink)', value: nf(d.total / 1000, 1), label: 'All three' },
      ...HEATED.map(z => ({ color: ZCOLOR[z], value: nf(d[z] / 1000, 1), label: SHORT[z] })),
    ]);
  });
  hit.addEventListener('pointerleave', () => { xh.setAttribute('visibility', 'hidden'); hideTip(); });
  legend($('#wind-legend'), [{ color: 'var(--ink)', label: 'All three heated zones', line: true }, ...HEATED.map(z => ({ color: ZCOLOR[z], label: SHORT[z], line: true }))]);

  // Callouts.
  const heatMM = sum(R.main.heatTot) / 1e6, calm = R.calm ? sum(R.calm.heatTot) / 1e6 : null, w = R.worst;
  const dayOf = i => { const d = new Date(Date.UTC(2021, 0, 1) + Math.floor(i / 24) * 864e5); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${String(i % 24).padStart(2, '0')}:00`; };
  const items = [
    [`${nf(R.heatDesign.shop.load / 1000 + R.heatDesign.ground.load / 1000 + R.heatDesign.upper.load / 1000)} kBtu/h`, `ASHRAE 99.6% design: ${nf(Tdesign())}°F with its coincident ${nf(Vdesign(), 1)} mph wind`],
    [`${nf(w.total / 1000)} kBtu/h`, `worst hour in the TMY3 year: ${nf(w.T)}°F with ${nf(w.V)} mph wind (${dayOf(w.i)}). Size for the wind, not the cold alone.`],
    calm != null ? [`+$${nf((heatMM - calm) * 1e6 / inputs.plant.boilerEff / 1e5 * (inputs.rates.gasWinter ?? inputs.rates.gas))} a year`, `of gas goes to wind: it adds ${nf((heatMM / calm - 1) * 100)}% (${nf(heatMM - calm, 1)} MMBtu) to heating versus the same year in still air`] : ['off', 'turn wind on in Inputs to see its share'],
  ];
  $('#wind-callouts').replaceChildren(...items.map(([big, small]) => {
    const d = document.createElement('div'); d.className = 'callout';
    const bb = document.createElement('b'); bb.textContent = big;
    const s = document.createElement('span'); s.textContent = small;
    d.append(bb, s); return d;
  }));
}

// ---------------------------------------------------------------- week chart
const WEEKS = [
  ['Winter - Week Nearest Min Temperature For Period', 'Coldest week'],
  ['Winter - Week Nearest Average Temperature For Period', 'Typical winter week'],
  ['Spring - Week Nearest Average Temperature For Period', 'Typical spring week'],
  ['Summer - Week Nearest Average Temperature For Period', 'Typical summer week'],

  ['Autumn - Week Nearest Average Temperature For Period', 'Typical autumn week'],
];
const dayIndex = md => { const [mo, d] = md.split('/').map(s => parseInt(s, 10)); return Math.round((Date.UTC(2021, mo - 1, d) - Date.UTC(2021, 0, 1)) / 864e5); };
function fillWeeks() {
  const sel = $('#week');
  if (sel.options.length || !R.periods) return;

function renderWeek() {
  const el = $('#week-chart'), strip = $('#wind-strip');
  if (!R.main.T || !R.wx) {
    el.innerHTML = `<p class="sub" style="padding:40px 0">Hourly traces load with the first full run…</p>`;
    strip.replaceChildren(); legend($('#week-legend'), []); return;
  }

  const seriesT = { outdoor: Array.from({ length: n }, (_, k) => R.wx.T[i0 + k]) };
  for (const z of HEATED) seriesT[z] = Array.from({ length: n }, (_, k) => R.main.T[idx(z)][i0 + k]);
  const all = Object.values(seriesT).flat();
  const ticks = niceTicks(Math.min(...all), Math.max(...all), 6), lo = ticks[0], hi = ticks.at(-1);
  const x = k => m.l + k / (n - 1) * (W - m.l - m.r), y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  let g = '';
  for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(${t === 32 ? '--rule' : '--grid'})"/><text x="${m.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${t}°</text>`;
  for (let d = 0; d < 7; d++) {
    const di = d0 + d, dt = new Date(Date.UTC(2021, 0, 1) + di * 864e5);
    g += `<line x1="${x(d * 24)}" x2="${x(d * 24)}" y1="${H - m.b}" y2="${H - m.b + 4}" stroke="var(--rule)"/>`;
    g += `<text x="${x(d * 24 + 12)}" y="${H - 8}" text-anchor="middle">${DOW[di % 7]} ${dt.getUTCDate()}</text>`;
  }
  const order = ['outdoor', ...HEATED];
  for (const s of order) {
    const pts = seriesT[s].map((v, k) => `${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${ZCOLOR[s]}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  const ends = order.map(s => ({ s, y: y(seriesT[s][n - 1]) })).sort((a, b) => a.y - b.y);
  let prev = -Infinity;
  for (const e of ends) { e.ly = Math.max(e.y, prev + 13); prev = e.ly; }
  for (const e of ends) {
    const x0 = x(n - 1);
    g += `<line x1="${x0 + 2}" y1="${e.y}" x2="${x0 + 9}" y2="${e.ly}" stroke="var(--rule)"/>`;
    g += `<text class="lbl" x="${x0 + 12}" y="${e.ly + 4}">${e.s === 'outdoor' ? 'Outdoors' : SHORT[e.s]}</text>`;
  }
  g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" visibility="hidden"/><rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;

  // Wind strip, same x scale.
  const wind = Array.from({ length: n }, (_, k) => R.wx.V[i0 + k]);
  const Hs = 84, wt = niceTicks(0, Math.max(...wind, 10), 2), wh = wt.at(-1);
  const ys = v => 6 + (wh - v) / wh * (Hs - 12);
  let gs = '';
  for (const t of wt) gs += `<line x1="${m.l}" x2="${W - m.r}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${ys(t) + 3.5}" text-anchor="end">${t}</text>`;
  const wpts = wind.map((v, k) => `${x(k).toFixed(1)},${ys(v).toFixed(1)}`);
  gs += `<polygon points="${x(0)},${ys(0)} ${wpts.join(' ')} ${x(n - 1)},${ys(0)}" fill="var(--accent)" fill-opacity="0.12"/>`;
  gs += `<polyline points="${wpts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>`;
  gs += `<line class="xh" x1="0" x2="0" y1="4" y2="${Hs - 4}" stroke="var(--muted)" visibility="hidden"/>`;
  strip.innerHTML = `<svg width="${W}" height="${Hs}" viewBox="0 0 ${W} ${Hs}">${gs}</svg>`;

  const xhs = [el.querySelector('.xh'), strip.querySelector('.xh')];
  const hit = el.querySelector('.hit');
  hit.addEventListener('pointermove', e => {
    const box = el.getBoundingClientRect();
    const k = Math.max(0, Math.min(n - 1, Math.round((e.clientX - box.left - m.l) / (W - m.l - m.r) * (n - 1))));
    for (const xh of xhs) { xh.setAttribute('x1', x(k)); xh.setAttribute('x2', x(k)); xh.setAttribute('visibility', 'visible'); }
    const di = d0 + Math.floor(k / 24), dt = new Date(Date.UTC(2021, 0, 1) + di * 864e5);
    showTip(e, `${DOW[di % 7]} ${MON[dt.getUTCMonth()]} ${dt.getUTCDate()}, ${String(k % 24).padStart(2, '0')}:00`, [
      ...order.map(s => ({ color: ZCOLOR[s], value: `${nf(seriesT[s][k], 1)}°F`, label: s === 'outdoor' ? 'Outdoors' : SHORT[s] })),
      { color: 'var(--accent)', value: `${nf(wind[k])} mph`, label: 'Wind' },
    ]);
  });
  hit.addEventListener('pointerleave', () => { for (const xh of xhs) xh.setAttribute('visibility', 'hidden'); hideTip(); });
  legend($('#week-legend'), order.map(s => ({ color: ZCOLOR[s], label: s === 'outdoor' ? 'Outdoors' : SHORT[s], line: true })));
}

// ---------------------------------------------------------------- inputs form
const SHELTER = ['1 · open, no obstructions', '2 · a few trees or sheds', '3 · some shelter nearby', '4 · suburban, heavy', '5 · downtown'];
const GROUP_NOTES = {
  'Shop (north leg)': 'No windows. One door on the lee side and an 86″ walkthrough to the ground level. The vestibule in front of its west wall is cosmetic, so that wall counts as an outside wall.',
  'Center, ground level': 'No windows. A 36″ walkout onto the porch, and 86″ walkthroughs to the shop and the south leg.',
  'Center, upper level': 'Sixteen 41″ × 67″ windows, a 36″ door and a 72″ door, from you, placed in the 3D model.',
};
function buildForm() {
  const form = $('#form');
  form.replaceChildren();
  SCHEMA.forEach((grp, gidx) => {
    const det = document.createElement('details');
    if (gidx < 3) det.open = true;
    const sum = document.createElement('summary'); sum.textContent = grp.group; det.append(sum);
    const noteText = grp.note || GROUP_NOTES[grp.group];
    if (noteText) {
      const n = document.createElement('p'); n.className = 'groupnote';
      n.textContent = noteText;
      det.append(n);
    }
    for (const [path, label, unit, src, min, max, step] of grp.items) {
      const id = 'in-' + path.replace(/\./g, '-');
      const f = document.createElement('div'); f.className = 'field'; f.dataset.path = path;
      const l = document.createElement('label'); l.htmlFor = id; l.textContent = label;
      const meta = document.createElement('div'); meta.className = 'meta';
      const bdg = document.createElement('span'); bdg.className = `badge ${src}`; bdg.textContent = src;
      meta.append(bdg);
      if (unit && unit !== 'on/off') meta.append(document.createTextNode(unit));
      let ctl;
      const val = getIn(inputs, path);
      if (path === 'site.shelter') {
        ctl = document.createElement('select');
        const opts = SHELTER.map((t, k) => [k + 1, t]);
        for (const [v, t] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = t; ctl.append(o); }
        ctl.value = String(val);
      } else if (path === 'site.wind') {
        ctl = document.createElement('input'); ctl.type = 'checkbox'; ctl.checked = !!val;
      } else {
        ctl = document.createElement('input'); ctl.type = 'number'; ctl.inputMode = 'decimal';
        ctl.min = min; ctl.max = max; ctl.step = step; ctl.value = val;
      }
      ctl.id = id;
      ctl.addEventListener('change', () => onInput(path, ctl));
      if (ctl.type === 'number') ctl.addEventListener('input', () => { if (ctl.validity.valid && ctl.value !== '') onInput(path, ctl); });
      f.append(l, ctl, meta);
      det.append(f);
    }
    form.append(det);
  });
  markChanged();
}
function onInput(path, ctl) {
  let v;
  if (ctl.type === 'checkbox') v = ctl.checked;
  else {
    v = Number(ctl.value);
    if (!Number.isFinite(v)) return;
    const lo = ctl.min === '' ? -Infinity : Number(ctl.min), hi = ctl.max === '' ? Infinity : Number(ctl.max);
    v = Math.min(hi, Math.max(lo, v));
    if (path === 'site.shelter') v = Math.round(v);
  }
  if (getIn(inputs, path) === v) return;
  setIn(inputs, path, v);

  P.steps.forEach((s, k) => row(k + 1, s.label, [usd(s.dCap), usd(s.dSave), `${nf(s.pb, 1)} yr`, usd(s.dNpv), `${sysLabel(s.cfg)} · bills ${usd(s.sys.total)}`]));
  const sep = tb.insertRow(); sep.className = 'sep'; const sc = sep.insertCell(); sc.colSpan = 6; sc.textContent = 'Next in line, not worth it yet';
  for (const s of P.rejected) row('', s.label, [usd(s.dCap), usd(s.dSave), s.dSave > 0 ? `${nf(s.pb, 1)} yr` : 'never', usd(s.dNpv), ''], 'no');
  row('', `${P.inputs.capex.batteryKwh} kWh battery`, [usd(P.battery.dCap), usd(P.battery.dSave), P.battery.dSave > 0 ? `${nf(P.battery.dCap / P.battery.dSave, 1)} yr` : 'never', '', `net metering already stores surplus at full retail value${P.battery.possible ? '' : `; would also need a hybrid inverter instead of the ${P.inverter.name}`}`], 'no');
  $('#ladder-sub').textContent = `Starting from the ${lc(P.setup.label)} with no solar (bills ${usd(P.baseline.total)} a year), each step is the addition that pays for itself fastest. Steps stop when the next one is worth less than it costs at ${nf(P.inputs.finance.discount * 100, 1)}% over ${P.inputs.finance.horizon} years. "Worth" is that step's net present value.`;
}

function renderInverters() {
  const t = $('#inverters'), I = P.inverters;
  t.innerHTML = '<thead><tr><th>Inverter</th><th>Best system</th><th class="num">Costs</th><th class="num">Saves / yr</th><th class="num">Pays back</th><th class="num">Worth</th></tr></thead>';
  const tb = t.createTBody();

  for (const r of I) {
    const tr = tb.insertRow(); if (r.id === P.inverter.id) tr.className = 'pick';
    const c0 = tr.insertCell(); c0.textContent = r.name;
    const k = document.createElement('div'); k.className = 'cellnote';
    k.textContent = `${kinds[r.kind]}${r.ac ? ` · ${r.ac} kW AC, ${r.dc} kW panels max` : ''}${r.idleW >= 10 ? ` · ${r.idleW} W standby` : ''}`;
    c0.append(k);
    tr.insertCell().textContent = r.cfg.kw ? `${r.cfg.kw} kW${r.kind === 'micro' ? '' : ` on ${r.cfg.inv}`}` : 'none';
    for (const v of [usd(r.capex), usd(r.save1), r.payback ? `${nf(r.payback, 1)} yr` : 'never', usd(r.npv)]) { const c = tr.insertCell(); c.className = 'num'; c.textContent = v; }
  }

  $('#inv-sub').textContent = `On the ${lc(P.setup.label)}, each inverter gets its own purchase order, capped at ${P.inputs.nemCapKwAC} kW AC in total. ${best.name} comes out ahead at these prices, but the whole field is within ${usd(spread)} over ${P.inputs.finance.horizon} years${eg4 && eg4 !== best ? `, and the best battery-ready option, the ${eg4.name}, trails it by ${usd(best.npv - eg4.npv)}` : ''}. That is smaller than the uncertainty in any installer's quote, so let price and what you want later decide. Hybrids draw standby power around the clock (about $${nf(70 * 8.76 * P.inputs.rates.elec)} a year at 70 W) but can add a battery or backup; grid-tie inverters can't. The array is on the shop roof, so every panel needs rapid shutdown (the Tigo units in the wiring sheet); microinverters include it.`;
}

function renderCurve() {
  const el = $('#curve'), W = Math.max(300, el.clientWidth), H = 280, m = { l: 56, r: 118, t: 16, b: 34 };
  const d = P.curve, maxKw = d.at(-1).kw;
  const COL = { c35: 'var(--s1)', h60: 'var(--s2)', both: 'var(--s3)', two60: 'var(--s4)' };
  const S = P.lines.map(r => [r.opt, r.label, COL[r.opt]]);
  const vals = d.flatMap(r => S.map(([k]) => r[k]));
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 5), lo = ticks[0], hi = ticks.at(-1);
  const x = k => m.l + k / maxKw * (W - m.l - m.r), y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  let g = '';
  for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${usd(t / 1000)}k</text>`;
  for (let k = 0; k <= maxKw; k += 6) g += `<text x="${x(k)}" y="${H - 16}" text-anchor="middle">${k}</text>`;
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H}" text-anchor="middle">array size, kW DC</text>`;
  const invEdge = P.inverter.dcMax;
  if (P.inverter.maxUnits > 1 && invEdge < maxKw) g += `<line x1="${x(invEdge)}" x2="${x(invEdge)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--rule)"/><text x="${x(invEdge) + 4}" y="${m.t + 10}">2nd inverter →</text>`;
  const ends = [];
  for (const [k, label, col] of S) {
    g += `<polyline points="${d.map(r => `${x(r.kw)},${y(r[k])}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    ends.push({ label, y: y(d.at(-1)[k]) });
  }
  ends.sort((a, b) => a.y - b.y); let prev = -1e9;
  for (const e of ends) { e.ly = Math.max(e.y, prev + 14); prev = e.ly; g += `<text class="lbl" x="${x(maxKw) + 8}" y="${e.ly + 4}">${e.label}</text>`; }
  const R = P.recommended.cfg, row = d.find(r => r.kw === Math.round(R.kw));
  if (row) { const v = P.lifeCost; g += `<circle cx="${x(R.kw)}" cy="${y(v)}" r="5" fill="var(--ink)" stroke="var(--sheet)" stroke-width="2"/><text class="lbl" x="${x(R.kw)}" y="${y(v) + 20}" text-anchor="middle">${P.owner ? 'your array' : `${R.kw} kW`}: ${usd(v)}</text>`; }
  g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" visibility="hidden"/><rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const xh = el.querySelector('.xh');
  el.querySelector('.hit').addEventListener('pointermove', e => {
    const b = el.getBoundingClientRect(), k = Math.round((e.clientX - b.left - m.l) / (W - m.l - m.r) * maxKw), r = d[Math.max(0, Math.min(d.length - 1, k))];
    xh.setAttribute('x1', x(r.kw)); xh.setAttribute('x2', x(r.kw)); xh.setAttribute('visibility', 'visible');
    showTip(e, `${r.kw} kW DC · 25-yr cost`, S.map(([k2, l, c]) => ({ color: c, value: usd(r[k2]), label: l })).sort((a, b) => r[S.find(q => q[1] === a.label)[0]] - r[S.find(q => q[1] === b.label)[0]]));
  });
  el.querySelector('.hit').addEventListener('pointerleave', () => { xh.setAttribute('visibility', 'hidden'); hideTip(); });
  legend($('#curve-legend'), S.map(([, l, c]) => ({ label: l, color: c, line: true })));
  $('#curve-sub').textContent = `25-year cost of each heat pump choice, with its better AHU count and heating mode, by array size on the ${P.inverter.name}; lower is better. Each setup gets cheaper as the array grows while the panels offset power bought at retail, and a heat pump that heats can also turn fall surplus into heat instead of $${P.inputs.rates.avoided}/kWh credit. The curves flatten where extra panels only make credit that is paid out at $${P.inputs.rates.avoided}/kWh.`;
}

function renderYear() {
  const el = $('#year'), W = Math.max(300, el.clientWidth), H = 240, m = { l: 48, r: 8, t: 10, b: 24 };
  const R = P.recommended, prod = R.monProd, use = R.monLoad;
  const ticks = niceTicks(0, Math.max(...prod, ...use), 5), hi = ticks.at(-1);
  const y = v => m.t + (hi - v) / hi * (H - m.t - m.b), band = (W - m.l - m.r) / 12, bw = Math.min(16, band * 0.32);
  let g = '';
  for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(${t === 0 ? '--muted' : '--grid'})"/><text x="${m.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${nf(t)}</text>`;
  const bar = (x0, v, col) => { const yt = y(v), yb = y(0), r = Math.min(4, (yb - yt) / 2); return yb - yt < 0.5 ? '' : `<path d="M${x0},${yb}V${yt + r}Q${x0},${yt} ${x0 + r},${yt}H${x0 + bw - r}Q${x0 + bw},${yt} ${x0 + bw},${yt + r}V${yb}Z" fill="${col}"/>`; };
  for (let k = 0; k < 12; k++) {
    const cx = m.l + band * k + band / 2;
    g += bar(cx - bw - 1, prod[k], 'var(--s2)') + bar(cx + 1, use[k], 'var(--s1)');
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${MON[k][0]}</text><rect class="hit" data-k="${k}" x="${m.l + band * k}" y="${m.t}" width="${band}" height="${H - m.t - m.b}" fill="transparent"/>`;
  }
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  el.querySelectorAll('.hit').forEach(h => {
    const k = +h.dataset.k;
    h.addEventListener('pointermove', e => showTip(e, MON[k] + ' · kWh', [
      { color: 'var(--s2)', value: nf(prod[k]), label: 'Solar made' }, { color: 'var(--s1)', value: nf(use[k]), label: 'Building used' },
      { color: 'var(--muted)', value: nf(R.monBank[k]), label: 'Credit banked after' }, { color: 'var(--muted)', value: usd(R.monBill[k]), label: 'Electric bill' }]));
    h.addEventListener('pointerleave', hideTip);
  });
  legend($('#year-legend'), [{ label: 'Solar made', color: 'var(--s2)' }, { label: 'Building used', color: 'var(--s1)' }]);
  const tbl = document.createElement('table');
  tbl.innerHTML = '<thead><tr><th>Month</th><th class="num">Solar kWh</th><th class="num">Used kWh</th><th class="num">Banked kWh</th><th class="num">Electric $</th><th class="num">Gas therms</th></tr></thead>';
  const tb = tbl.createTBody();
  MON.forEach((mo, k) => { const tr = tb.insertRow(); tr.insertCell().textContent = mo; for (const v of [nf(prod[k]), nf(use[k]), nf(R.monBank[k]), usd(R.monBill[k]), nf(R.monGas[k])]) { const c = tr.insertCell(); c.className = 'num'; c.textContent = v; } });
  $('#year-table').replaceChildren(tbl);
  $('#year-sub').textContent = `${sysLabel(R.cfg)}: ${nf(R.prod)} kWh made against ${nf(R.loadKWh)} kWh used. Summer surplus is banked at full retail value and spent in the fall; ${usd(R.paidOut)} of leftover credit is paid out at the ${MON[P.inputs.rates.trueUpMonth]} true-up. Gas falls to ${nf(R.therms)} therms (from ${nf(P.today.therms)}) for the heat the heat pump can't cover.`;
}

function renderVariants() {
  const t = $('#variants'), HPL = { c35: 'One 3.5-ton', h60: 'One 6-ton', both: '3.5-ton + 6-ton', two60: 'Two 6-tons' }, opts = Object.entries(HPL);
  t.innerHTML = `<thead><tr><th>If</th>${opts.map(([, l]) => `<th class="num">${l}</th>`).join('')}<th>Cheapest</th></tr></thead>`;
  const tb = t.createTBody();
  for (const v of P.variants) {
    const tr = tb.insertRow();
    tr.insertCell().textContent = v.label;
    for (const [k] of opts) {
      const c = tr.insertCell(); c.className = 'num'; const x = v.per[k];
      c.textContent = x ? usd(x.cost) : '—';
      if (x) { const n = document.createElement('div'); n.className = 'cellnote'; n.textContent = `${x.kw} kW · ${{ smart: 'smart', hp: 'heat first', cool: 'cool only' }[x.mode]}${x.ahus === 2 ? ' · 2 AHUs' : ''}${x.unmet > 1e5 ? ` · ${nf(x.unmet / 1e6, 1)} MMBtu short` : ''}`; c.append(n); }
    }
    const c = tr.insertCell(); const sp = document.createElement('span'); sp.className = 'verdict yes'; sp.textContent = HPL[v.winner]; c.append(sp);
  }
  const i = P.inputs, gasMM = i.rates.gas / 0.88 * 10, hpMM = i.rates.elec / (2.6 * 3412) * 1e6, surMM = i.rates.avoided / (2.6 * 3412) * 1e6;
  $('#hp-sub').textContent = `25-year cost of each setup under other rules and prices, each with its best array on the ${P.inverter.name}. Heat from gas costs about $${gasMM.toFixed(2)} per MMBtu. A heat pump on bought power costs about $${hpMM.toFixed(2)}, but on solar it would otherwise sell at $${i.rates.avoided}/kWh it costs only $${surMM.toFixed(2)}. At the hot water your floor and AHU need, the heat pump's real COP is lower still. So it pays to heat with it only on surplus solar credit, and bigger units that displace more gas don't pay for themselves. "MMBtu short" is cold-snap heat the 10 kW strips can't cover once gas is gone; with gas dropped, a lone 3.5-ton leaves the building cold on the worst days.`;
}

function renderMethod() {
  const i = P.inputs;
  const items = [
    ['Sun', `Casper TMY3 hourly beam, diffuse and global radiation on panels flush on the shop's south roof slope, ${i.pv.tilt}° facing south, less ${nf(i.pv.shade * 100, 1)}% of the year's sun lost to the two-story center block's shade (roofpv.js, panel by panel): ${nf(P.pvYield)} kWh per kW of panels a year, ${nf(P.pvMonthly[11])} in December and ${nf(P.pvMonthly[6])} in July. Cell temperature follows air temperature and wind, which suits cold, windy Casper. ${nf(i.pv.losses * 100)}% losses. The ${P.inverter.name} converts at ${nf(P.inverter.eff * 100, 1)}%${P.inverter.ac ? ` and clips at ${P.inverter.ac} kW AC per unit, taking up to ${P.inverter.dc} kW of panels` : ''}.`],
    ['Loads', `Heating and cooling come hour by hour from the thermal model, with upstairs internal gains set from your ${i.domestic.kWhPerDay} kWh/day at ${nf(i.domestic.indoor * 100)}% indoors. Household electricity follows a typical daily shape. Hot water is ${i.dhw.galPerDay} gal/day heated to ${i.dhw.setF}°F from Casper ground water, by gas today.`],
    ['Heat pumps', `Each Apollo follows your 6-ton COP and capacity curves (${i.hp.cop47} at 47°F, ${i.hp.cop17} at 17°F, ${i.hp.cop5} at 5°F, derated ${i.hp.derate}; stops below ${i.hp.minT}°F), taken as rated at ${i.hp.ratedWaterF}°F water, with capacity scaled by tons. As in your hydronic pack, the heat pump charges the 250-gal buffer on an outdoor reset, ${i.hp.reset.lowF}°F at ${i.hp.reset.lowAtF}°F outdoors up to ${i.hp.reset.highF}°F at ${i.hp.reset.highAtF}°F. Every °F above the rating costs ${nf(i.hp.copPerF * 100, 1)}% of COP. The tank feeds the radiant floor upstairs, and the AHU (downstairs, plus upstairs when the floor can't keep up). The shop is heated only on demand, with gas: ${i.shop.heater === 'modine' ? 'the Modine' : 'max-temperature water straight from the Navien'}; the heat pump never serves it. It also preheats the combi's cold water through the lower coil, except while it's chilled. The floor puts out ${i.floor.btuPerFt2F} Btu/h per ft² per °F over ${nf(i.floor.areaFt2)} ft², and it carries ${nf(P.setup.floorShare * 100)}% of the upstairs heat. It loses ${nf(i.floor.downLoss * 100)}% downward through the R-19, which the ground level uses when it needs heat. A second AHU would heat upstairs by air with the floor off. "Heats when it beats gas" spends each month's banked solar credit that would otherwise be paid out at the true-up on the best COP hours first, plus any hour where the heat pump beats gas outright. It never makes a month buy power it wouldn't have. Cooling runs the most efficient unit first (COP ${i.hp.units.t35.coolCop} for the 3.5-ton, ${i.hp.units.t60.coolCop} for the 6-ton). Prices are MBTEK list plus $${nf(i.hp.install)} per unit to install.`],
    ['Control', `Rocky Mountain Power nets kWh by the month, so when the heat pump runs within a month doesn't change the bill. Charging the buffer only while panels export, as in the pack's future Home Assistant plan, earns nothing extra on its own. What matters is whether the year ends with credit paid out at $${i.rates.avoided}/kWh. At $${i.rates.elec}/kWh bought, heat pump heat costs more than gas unless its COP tops ${nf(i.rates.elec / (i.rates.gas / (1e5 * i.boilerEff)) / 3412, 1)}, which it never reaches here. So the trigger to build is 'projected ${MON[i.rates.trueUpMonth]} credit left over': heat with the heat pump while that's positive (mostly the fall, before a year-end true-up), and let the Navien carry the rest.`],
    ['Household', `Your ${i.domestic.kWhPerDay} kWh/day (${nf(i.domestic.kWhPerDay * 365)} kWh a year) is in every load, along with ${i.dhw.galPerDay} gal/day of hot water for four people. The recommended array makes ${nf(P.recommended.prod)} kWh against ${nf(P.recommended.loadKWh)} kWh used, so over the year it covers the household and the heat pump. In ${P.recommended.monProd.map((v, k) => v < P.recommended.monLoad[k] ? MON[k] : null).filter(Boolean).join(', ') || 'no month'}, use runs ahead of production and banked credit makes up the difference.`],
    ['Net metering', `Each month's kWh are netted. Surplus is banked at full retail value and carried forward; whatever is left at the end of ${MON[i.rates.trueUpMonth]} is paid at $${i.rates.avoided}/kWh. Systems are limited to ${i.nemCapKwAC} kW of inverter AC rating, which allows ${P.inverter.maxUnits > 1 ? P.inverter.maxUnits + ' ' + P.inverter.name + 's' : P.inverter.kind === 'micro' ? P.inverter.dcMax + ' kW of panels on microinverters' : 'one ' + P.inverter.name}. Confirm both the limit and the true-up date with Rocky Mountain Power.`],
    ['Money', `Panel, site and battery costs are from your sheet: $${i.capex.pvPerKw}/kW covers panels, racking and install, so if the ZnShine pallets are already paid for, your array's real cost to finish is lower than shown. The 18kPV is your refurbished price; other inverters are 2026 retail listings. Savings grow ${nf(i.rates.escalation * 100, 1)}% a year with rates, less ${nf(i.rates.degradation * 100, 1)}% panel degradation. "Worth" is net present value at ${nf(i.finance.discount * 100, 1)}% over ${i.finance.horizon} years. Payback counts the growing savings.`],
    ['Not counted', 'The controller the smart mode needs (a seasonal schedule and an outdoor-temperature lockout get most of it), extra electrical service for two units, tax credits (the federal residential credit ended in 2025; set any rebate under Costs), demand charges (none on your Schedule 25 bill), and panel or inverter replacement.'],
  ];
  $('#method').replaceChildren(...items.map(([k, v]) => { const li = document.createElement('li'); const b = document.createElement('b'); b.textContent = k + '. '; li.append(b, document.createTextNode(v)); return li; }));
}

// ---------------------------------------------------------------- inputs
function buildForm() {
  const form = $('#form'); form.replaceChildren();
  SCHEMA.forEach((grp, gi) => {
    const det = document.createElement('details'); if (gi < 2 || grp.group === 'Heat pumps') det.open = true;
    const sm = document.createElement('summary'); sm.textContent = grp.group; det.append(sm);
    for (const [path, label, unit, src, min, max, step] of grp.items) {
      const id = 'in-' + path.replace(/\./g, '-');
      const f = document.createElement('div'); f.className = 'field'; f.dataset.path = path;
      const l = document.createElement('label'); l.htmlFor = id; l.textContent = label;
      const meta = document.createElement('div'); meta.className = 'meta';
      const b = document.createElement('span'); b.className = 'badge ' + src; b.textContent = src; meta.append(b);
      if (unit) meta.append(document.createTextNode(unit));
      let ctl;
      if (SELECTS[path]) {
        ctl = document.createElement('select');
        for (const [v, t] of SELECTS[path]) { const o = document.createElement('option'); o.value = v; o.textContent = t; ctl.append(o); }
        ctl.value = String(getIn(inputs, path));
      } else {
        ctl = document.createElement('input'); ctl.type = 'number'; ctl.inputMode = 'decimal'; ctl.min = min; ctl.max = max; ctl.step = step; ctl.value = getIn(inputs, path);
      }
      ctl.id = id;
      const on = () => {
        let v = ctl.value;
        if (ctl.tagName === 'SELECT') v = ['backup', 'pv.inverter', 'hp.option', 'hp.heat', 'shop.heater'].includes(path) || (path === 'hp.ahus' && v === 'auto') ? v : Number(v);
        else { v = Number(v); if (!Number.isFinite(v) || ctl.value === '') return; v = Math.min(Number(max), Math.max(Number(min), v)); }
        if (getIn(inputs, path) === v) return;
        setIn(inputs, path, v);
        if (path === 'inverters.eg4_18kpv.idleW') for (const k of ['flexboss21', 'flexboss18', 'eg4_12kpv']) inputs.inverters[k].idleW = v;
        save(); mark(); run();
      };
      ctl.addEventListener('change', on);
      if (ctl.tagName === 'INPUT') ctl.addEventListener('input', () => { if (ctl.validity.valid) on(); });
      f.append(l, ctl, meta); det.append(f);
    }
    form.append(det);
  });
  mark();
}
const mark = () => tabRoot.querySelectorAll('.field').forEach(f => f.classList.toggle('changed', String(getIn(inputs, f.dataset.path)) !== String(getIn(SOLAR_INPUTS, f.dataset.path))));
$('#reset').addEventListener('click', () => { inputs = clone(SOLAR_INPUTS); save(); buildForm(); run(0); });

let rz = 0;
new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (P) { renderCurve(); renderYear(); } }); }).observe(resultsEl);
buildForm();
if (atDefaults()) {
  fetch(new URL('./data/solar-defaults.json', import.meta.url)).then(r => r.json()).then(d => { if (!P) { P = d; render(); setStatus('Up to date'); } }).catch(() => run(0));
} else run(0);
});
</script>

<script type="module">
zeroRd.page('wiring', async tabRoot => {

const n0 = v => Math.round(v).toLocaleString('en-US');
